<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de Prod</title>
<meta name="description" content="Apprendre à estimer sa charge de travail : découpe, estime avec un indice de confiance, chronomètre et compare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='22' r='14' fill='%23ffd35c' stroke='%231d1a16' stroke-width='3'/%3E%3Cpath d='M20 22v-8M20 22l6 3M16 5h8' stroke='%231d1a16' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>

/* ============ Artist Profile & Server Sync ============ */
.artist-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 6px;
  border-radius: 999px; border: 1.5px solid var(--line-soft); background: var(--card-2);
  font-weight: 650; font-size: .88rem; cursor: pointer; transition: all .15s ease;
}
.artist-badge:hover { border-color: var(--line); background: var(--hl-soft); color: #1d1a16; }
.artist-badge .avatar {
  width: 22px; height: 22px; border-radius: 50%; background: var(--hl); border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: .78rem; font-weight: 800; color: #1d1a16;
}
.artist-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
  margin: 12px 0; max-height: 280px; overflow-y: auto; padding: 2px;
}
.artist-card-btn {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px;
  border: 1.5px solid var(--line-soft); background: var(--card-2); text-align: left; cursor: pointer;
  transition: transform .08s ease, border-color .12s;
}
.artist-card-btn:hover { border-color: var(--line); background: var(--card); transform: translateY(-1px); }
.artist-card-btn.cur { border-color: var(--line); background: var(--hl-soft); }
.artist-card-btn .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--hl); border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .95rem; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ok);
  margin-right: 6px; vertical-align: middle;
}
.sync-dot.saving { background: var(--hl); animation: pulse 1s infinite; }
.sync-dot.offline { background: var(--miss); }

/* ============ Tokens ============ */
:root {
  color-scheme: light;
  --paper: #f8fafc;
  --paper-dot: #e2e8f0;
  --card: #ffffff;
  --card-2: #f1f5f9;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --line: #0f172a;
  --line-soft: #cbd5e1;
  --line-hair: #e2e8f0;
  --hl: #f59e0b;
  --hl-soft: #fef3c7;
  --band: #fde68a;
  --ok: #2563eb;
  --miss: #dc2626;
  --run: #0f172a;
  --shadow-c: #0f172a;
  --focus: #2563eb;
  --overlay: rgba(15, 23, 42, .6);
  --radius: 12px;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0b0f17;
    --paper-dot: #1e293b;
    --card: #131b2e;
    --card-2: #1e293b;
    --ink: #f8fafc;
    --ink-2: #cbd5e1;
    --ink-3: #94a3b8;
    --line: #334155;
    --line-soft: rgba(248, 250, 252, .18);
    --line-hair: rgba(248, 250, 252, .10);
    --hl: #f59e0b;
    --hl-soft: rgba(245, 158, 11, .20);
    --band: rgba(245, 158, 11, .36);
    --ok: #3b82f6;
    --miss: #ef4444;
    --run: #f8fafc;
    --shadow-c: #000;
    --overlay: rgba(0, 0, 0, .75);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0b0f17;
  --paper-dot: #1e293b;
  --card: #131b2e;
  --card-2: #1e293b;
  --ink: #f8fafc;
  --ink-2: #cbd5e1;
  --ink-3: #94a3b8;
  --line: #334155;
  --line-soft: rgba(248, 250, 252, .18);
  --line-hair: rgba(248, 250, 252, .10);
  --hl: #f59e0b;
  --hl-soft: rgba(245, 158, 11, .20);
  --band: rgba(245, 158, 11, .36);
  --ok: #3b82f6;
  --miss: #ef4444;
  --run: #f8fafc;
  --shadow-c: #000;
  --overlay: rgba(0, 0, 0, .75);
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1px, transparent 1px);
  background-size: 20px 20px;
  min-height: 100vh;
  overflow-x: hidden;
}
h1, h2, h3 { line-height: 1.15; margin: 0 0 .4em; font-weight: 750; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .7em; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .88rem; }
.hand { font-family: var(--hand); font-size: 1.35rem; line-height: 1.1; color: var(--ink-2); font-weight: 600; }
.mark { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 88%, transparent 88%); padding: 0 .08em; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 16px; }
.icon { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px; }

/* ============ Header ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--line);
}
.topbar-in { max-width: 1140px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
.brand svg { width: 34px; height: 34px; }
.nav { display: flex; gap: 6px; }
.nav a {
  text-decoration: none; padding: 7px 12px; border-radius: 999px; font-weight: 600; color: var(--ink-2);
  border: 2px solid transparent;
}
.nav a:hover { color: var(--ink); background: var(--card-2); }
.nav a[aria-current="page"] { color: #1d1a16; border-color: var(--line); background: var(--hl); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.top-spacer { flex: 1; }
.save-state { font-size: .82rem; color: var(--ink-3); white-space: nowrap; }
.timer-pill {
  display: none; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--card); font-weight: 600; font-size: .9rem; max-width: 340px;
}
.timer-pill.on { display: inline-flex; }
.timer-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--miss); animation: pulse 1.4s infinite; flex: none; }
.timer-pill .tp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; text-decoration: none; }
@keyframes pulse { 50% { opacity: .25; } }

main { max-width: 1140px; margin: 0 auto; padding: 22px 16px 80px; }

/* ============ Buttons & inputs ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 11px; border: 2px solid var(--line); background: var(--card);
  font-weight: 650; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow-c); text-decoration: none;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
  white-space: nowrap;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--shadow-c); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shadow-c); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--shadow-c); }
.btn-primary { background: var(--hl); color: #1d1a16; border-color: #1d1a16; }
.btn-big { padding: 13px 20px; font-size: 1.05rem; border-radius: 13px; }
.btn-sm { padding: 5px 10px; font-size: .88rem; border-radius: 9px; box-shadow: 1.5px 1.5px 0 var(--shadow-c); }
.btn-ghost { border-color: transparent; box-shadow: none; background: transparent; }
.btn-ghost:hover { background: var(--card-2); box-shadow: none; transform: none; }
.btn-ghost:active { transform: none; }
.btn-danger { color: var(--miss); }
.btn-soft { border-color: var(--line-soft); box-shadow: none; }
.btn-soft:hover { border-color: var(--line); box-shadow: none; transform: none; }
.btn-soft:active { transform: none; }
.icon-btn { width: 38px; height: 38px; padding: 0; border-radius: 10px; }
.icon-btn.btn-sm { width: 32px; height: 32px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .lbl { font-weight: 650; font-size: .9rem; }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 11px; border-radius: 10px; border: 2px solid var(--line-soft);
  background: var(--card); transition: border-color .15s;
  min-width: 0;
}
.input:hover { border-color: color-mix(in srgb, var(--line) 45%, transparent); }
.input:focus { border-color: var(--line); outline: none; box-shadow: 0 0 0 3px var(--hl-soft); }
.input.bad { border-color: var(--miss); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.45; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.title-input {
  font-size: clamp(1.5rem, 3.6vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; border: 2px dashed transparent;
  background: transparent; padding: 2px 8px; margin-left: -10px; border-radius: 10px; width: calc(100% + 10px);
  display: block; resize: none; overflow: hidden; line-height: 1.15; min-height: 0;
}
.title-input:hover { border-color: var(--line-soft); }
.title-input:focus { outline: none; border-color: var(--line); background: var(--card); }

/* ============ Cards ============ */
.card {
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
  box-shadow: 4px 4px 0 var(--shadow-c); padding: 20px;
  min-width: 0;
}
.card.soft { box-shadow: none; border-color: var(--line-soft); }
.card.tint { background: var(--card-2); }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2 { margin: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr); gap: 22px; align-items: start; }
.grid-eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
@media (max-width: 900px) {
  .grid-2, .grid-eq { grid-template-columns: minmax(0, 1fr); }
}

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1.5px solid var(--line-soft); font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--card);
  white-space: nowrap;
}
.chip.hl { background: var(--hl-soft); border-color: transparent; color: var(--ink); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--line); color: var(--ink); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 650; white-space: nowrap;
  padding: 2px 9px 2px 7px; border-radius: 999px; background: var(--card-2); border: 1.5px solid var(--line-soft);
}
.badge .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sw-ok { background: var(--ok); }
.sw-miss { background: var(--miss); }
.sw-hl { background: var(--hl); }
.sw-ink { background: var(--ink); }

/* ============ Page heads ============ */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { margin: 0; }
.back { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
.back:hover { color: var(--ink); }

.stepper { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0 22px; }
.step { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; color: var(--ink-3); padding: 4px 12px 4px 4px; border-radius: 999px; border: 2px solid transparent; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-soft); font-size: .85rem; }
.step.cur { color: var(--ink); border-color: var(--line); background: var(--card); }
.step.cur .n { background: var(--hl); border-color: #1d1a16; color: #1d1a16; }
.step.past { color: var(--ink-2); }
.step.past .n { background: var(--ink); color: var(--card); border-color: var(--ink); }
.step-sep { width: 22px; height: 2px; background: var(--line-soft); border-radius: 2px; }

/* ============ Banners ============ */
.banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 11px 14px; border-radius: 12px;
  border: 2px dashed var(--line-soft); background: var(--card); margin-bottom: 18px; font-size: .94rem;
}
.banner.warn { border-color: var(--miss); border-style: solid; }

/* ============ Projects list ============ */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
.pcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; cursor: pointer; transition: transform .1s ease, box-shadow .1s ease; }
.pcard:hover { transform: translate(-2px, -2px) rotate(-.3deg); box-shadow: 6px 6px 0 var(--shadow-c); }
.pcard h3 { font-size: 1.15rem; margin: 0; }
.pcard .meta { font-size: .85rem; color: var(--ink-2); }
.pcard .big { font-size: 1.5rem; font-weight: 800; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.status.plan::before { background: var(--hl); box-shadow: 0 0 0 1.5px #1d1a16; }
.status.wip::before { background: var(--miss); }
.status.done::before { background: var(--ok); }
.new-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 170px;
  border: 2.5px dashed var(--line-soft); border-radius: var(--radius); background: transparent; cursor: pointer; font-weight: 700; color: var(--ink-2);
}
.new-card:hover { border-color: var(--line); color: var(--ink); background: var(--card); }
.new-card .plus { width: 44px; height: 44px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 1.6rem; line-height: 1; }

.empty { text-align: center; padding: 36px 16px; }
.empty > svg.doodle { width: 150px; height: auto; margin-bottom: 8px; }
.empty p { max-width: 520px; margin: 0 auto 16px; }

/* ============ Plan table ============ */
.ttable { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 10px; }
.trow {
  display: grid; grid-template-columns: minmax(0, 1fr) 132px 160px 34px; gap: 8px 10px; align-items: start;
  padding: 10px; border-radius: 12px; background: var(--card-2); border: 1.5px solid transparent;
}
.trow:focus-within { border-color: var(--line-soft); }
.trow .input { padding: 7px 9px; background: var(--card); }
.trow > .t-name { grid-column: 1 / 4; grid-row: 1; font-weight: 700; font-size: 1.02rem; }
.trow > .t-del { grid-column: 4; grid-row: 1; align-self: center; }
.trow > .t-cat { grid-column: 1; grid-row: 2; font-size: .92rem; }
.trow > .t-est { grid-column: 2; grid-row: 2; }
.trow > .t-conf { grid-column: 3 / 5; grid-row: 2; padding-top: 4px; }
.trow .hintline { grid-column: 1 / -1; font-size: .82rem; color: var(--ink-2); display: flex; gap: 12px; flex-wrap: wrap; padding: 0 3px; }
.trow .hintline:empty { display: none; }
.range-txt { font-variant-numeric: tabular-nums; }
.add-row { display: flex; gap: 8px; margin-top: 6px; }
.add-row .input { flex: 1; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: .88rem; }
@media (max-width: 720px) {
  .trow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; }
  .trow > .t-name { grid-column: 1 / 3; }
  .trow > .t-del { grid-column: 3; }
  .trow > .t-cat { grid-column: 1; }
  .trow > .t-est { grid-column: 2 / 4; }
  .trow > .t-conf { grid-column: 1 / -1; grid-row: 3; flex-direction: row; align-items: center; }
}

/* Confidence dots */
.conf { display: inline-flex; align-items: center; gap: 3px; }
.conf button {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: transparent; padding: 0; cursor: pointer;
  transition: transform .1s;
}
.conf button:hover { transform: scale(1.15); }
.conf button.on { background: var(--ink); }
.conf.ro span { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink-2); display: inline-block; }
.conf.ro span.on { background: var(--ink-2); }
.conf-label { font-size: .8rem; color: var(--ink-2); margin-left: 6px; white-space: nowrap; }
.t-conf { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 720px) { .t-conf { flex-direction: row; align-items: center; } }

/* Summary panel */
.sum-big { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.sum-range { font-size: 1rem; color: var(--ink-2); margin-top: 6px; }
.sum-line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1.5px dashed var(--line-soft); font-size: .94rem; }
.verdict { padding: 10px 12px; border-radius: 10px; background: var(--card-2); font-size: .92rem; display: flex; gap: 10px; align-items: flex-start; }
.verdict .icon { margin-top: 2px; }
.conf-legend { width: 100%; border-collapse: collapse; font-size: .88rem; }
.conf-legend td { padding: 6px 4px; border-top: 1.5px dashed var(--line-soft); vertical-align: middle; }
.conf-legend td:last-child { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tips { padding-left: 18px; margin: 8px 0 0; }
.tips li { margin-bottom: 6px; }

/* ============ Track (estimate vs actual) ============ */
.track { position: relative; height: 26px; }
.track .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--line-hair); }
.track .band { position: absolute; top: 4px; height: 18px; border-radius: 6px; background: var(--band); }
.track .bar { position: absolute; left: 0; top: 9px; height: 8px; border-radius: 0 4px 4px 0; background: var(--run); transition: width .4s ease; }
.track .bar.in { background: var(--ok); }
.track .bar.over, .track .bar.under { background: var(--miss); }
.track .tick { position: absolute; top: 0; width: 3px; height: 26px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.track .endcap { position: absolute; top: 6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--card); background: inherit; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .84rem; color: var(--ink-2); align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 7px; }
.legend .k-band { width: 22px; height: 12px; border-radius: 4px; background: var(--band); }
.legend .k-tick { width: 3px; height: 16px; border-radius: 2px; background: var(--ink); }
.legend .k-bar { width: 22px; height: 7px; border-radius: 0 3px 3px 0; }

/* Report rows */
.rrows { display: flex; flex-direction: column; }
.rrow { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 9px 0; border-top: 1.5px dashed var(--line-soft); }
.rrow:first-child { border-top: none; }
.rrow .rname { font-weight: 650; font-size: .94rem; overflow-wrap: anywhere; }
.rrow .rname small { display: block; font-weight: 500; color: var(--ink-3); font-size: .8rem; }
.rrow .rval { font-size: .88rem; text-align: right; font-variant-numeric: tabular-nums; }
.rrow .rval b { font-size: .98rem; }
@media (max-width: 720px) {
  .rrow { grid-template-columns: minmax(0, 1fr) auto; }
  .rrow .track { grid-column: 1 / -1; grid-row: 2; }
}

/* ============ Production ============ */
.tcards { display: flex; flex-direction: column; gap: 14px; }
.tcard { background: var(--card); border: 2px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; transition: border-color .15s, box-shadow .15s; }
.tcard.running { border-color: var(--line); box-shadow: 4px 4px 0 var(--hl); }
.tcard.done { background: var(--card-2); }
.tcard.cut { opacity: .6; }
.tcard.cut .tc-name { text-decoration: line-through; }
.tc-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.play {
  width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--line); background: var(--hl); color: #1d1a16;
  display: grid; place-items: center; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow-c); transition: transform .08s;
}
.play:hover { transform: scale(1.05); }
.play:active { transform: scale(.95); }
.play.on { background: var(--ink); color: var(--card); }
.play[disabled] { background: var(--card-2); color: var(--ink-3); cursor: default; box-shadow: none; border-color: var(--line-soft); }
.play .icon { width: 22px; height: 22px; }
.tc-name { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.tc-sub { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.tc-time { text-align: right; }
.tc-clock { font-size: 1.5rem; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tc-est { font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.tc-track { margin: 12px 0 6px; }
.tc-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tc-note { font-size: .85rem; color: var(--ink-2); }
.why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1.5px dashed var(--line-soft); }
.why .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.edit-time { display: flex; gap: 6px; align-items: center; }
.edit-time .input { width: 110px; padding: 5px 8px; }
@media (max-width: 560px) {
  .tc-top { grid-template-columns: auto minmax(0, 1fr); }
  .tc-time { grid-column: 1 / -1; text-align: left; display: flex; gap: 10px; align-items: baseline; }
}
.add-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) 110px; gap: 8px; align-items: center; }
.add-form .t-conf { grid-column: 1 / -1; flex-direction: row; align-items: center; }
@media (max-width: 560px) { .add-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .add-form > :first-child { grid-column: 1 / -1; } }

.meter-line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }

/* ============ Report ============ */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-fig { font-size: clamp(3.2rem, 9vw, 4.6rem); font-weight: 800; letter-spacing: -.04em; line-height: .95; }
.hero-sub { font-size: 1.05rem; color: var(--ink-2); margin-top: 8px; max-width: 460px; }
.pv { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 1.05rem; margin-bottom: 10px; }
.pv b { font-size: 1.4rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { padding: 12px 14px; border-radius: 12px; background: var(--card-2); border: 1.5px solid var(--line-soft); }
.tile .tl { font-size: .82rem; color: var(--ink-2); font-weight: 600; }
.tile .tv { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 2px; }
.tile .td { font-size: .8rem; color: var(--ink-3); }

.findings { display: flex; flex-direction: column; gap: 10px; }
.finding { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 12px; background: var(--card-2); }
.finding .fi { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--card); }
.finding .fi .icon { width: 17px; height: 17px; }
.finding.good .fi { background: var(--ok); color: #fff; border-color: var(--ok); }
.finding.bad .fi, .finding.warn .fi { background: var(--miss); color: #fff; border-color: var(--miss); }
.finding.bad { box-shadow: inset 4px 0 0 var(--miss); }
.finding h3 { margin: 2px 0 3px; }
.finding p { margin: 0; font-size: .93rem; color: var(--ink-2); }
.finding .tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: var(--ink-3); }

.actions-list { list-style: none; padding: 0; margin: 0; counter-reset: a; display: flex; flex-direction: column; gap: 10px; }
.actions-list li { counter-increment: a; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.actions-list li::before {
  content: counter(a); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
  background: var(--hl); color: #1d1a16; border: 2px solid #1d1a16;
}
.actions-list li p { margin: 5px 0 0; }

/* ============ Dashboard charts ============ */
.chart { position: relative; width: 100%; min-height: 60px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg text { font-family: var(--font); }
.chart:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.hbars { display: flex; flex-direction: column; gap: 4px; }
.hbar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 92px; gap: 12px; align-items: center; padding: 5px 4px; border-radius: 8px; }
.hbar:hover, .hbar:focus-visible { background: var(--card-2); }
.hbar .hl-name { font-size: .9rem; font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.hbar .hl-name small { display: block; color: var(--ink-3); font-weight: 500; font-size: .76rem; }
.hbar .hl-val { font-size: .88rem; text-align: right; font-variant-numeric: tabular-nums; }
.htrack { position: relative; height: 22px; }
.htrack .axis0 { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-3); }
.htrack .zone { position: absolute; top: 1px; bottom: 1px; background: var(--band); border-radius: 4px; opacity: .7; }
.htrack .hb { position: absolute; top: 5px; height: 12px; }
.htrack .hb.pos { background: var(--miss); border-radius: 0 4px 4px 0; }
.htrack .hb.neg { background: var(--ok); border-radius: 4px 0 0 4px; }
.htrack .hb.plain { background: var(--ok); border-radius: 0 4px 4px 0; left: 0; }
.htrack .rail { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line-hair); }
.axis-note { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-3); margin: 4px 0 0; padding-left: calc(150px + 12px + 4px); padding-right: calc(92px + 12px + 4px); }
@media (max-width: 560px) {
  .hbar { grid-template-columns: minmax(0, 1fr) 80px; }
  .hbar .htrack { grid-column: 1 / -1; grid-row: 2; }
  .axis-note { padding-left: 4px; padding-right: 4px; }
}
details.data { margin-top: 12px; font-size: .88rem; }
details.data summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }
table.dt { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line-hair); }
table.dt th { color: var(--ink-3); font-weight: 650; font-size: .8rem; }
table.dt td.r, table.dt th.r { text-align: right; }
.dt-wrap { overflow-x: auto; }

#tip {
  position: fixed; z-index: 100; pointer-events: none; background: var(--card); color: var(--ink);
  border: 2px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: .85rem; box-shadow: 3px 3px 0 var(--shadow-c);
  max-width: 260px; opacity: 0; transition: opacity .1s; line-height: 1.35;
}
#tip.on { opacity: 1; }
#tip .tv { font-weight: 800; font-size: 1.05rem; }
#tip .tl { color: var(--ink-2); }
#tip .tt { font-weight: 700; margin-bottom: 3px; }

/* ============ Modal ============ */
.modal-bg { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .15s ease; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal.wide { width: min(720px, 100%); }
.modal h2 { margin-bottom: 10px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
@keyframes fade { from { opacity: 0; } }
.settings-sec { padding: 16px 0; border-top: 2px dashed var(--line-soft); }
.settings-sec:first-of-type { border-top: none; padding-top: 4px; }
.cat-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.cat-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--card);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 3px 3px 0 var(--hl); animation: fade .2s ease; max-width: calc(100% - 32px);
}

.doodle { color: var(--ink); }
.doodle .fillhl { fill: var(--hl); }
.doodle .fillcard { fill: var(--card); }

.print-only { display: none; }

/* ============ Équipes & Admin ============ */

  margin-top: 16px;
}
.stat-box {

}

}

/* ============ Tabs & Kanban ============ */

<script>
(() => {
'use strict';
/* ================== CONSTANTES ================== */
const STORE_KEY = 'carnet-de-prod:v1';
const THEME_KEY = 'carnet-de-prod:theme';
const DAY_MIN = 7 * 60; // "1j" = 7h de travail

// Niveau de confiance -> fourchette autour de l'estimation (multiplicateurs)
const CONF = {
  1: { label: 'Jamais fait', hint: 'Je découvre complètement', lo: 0.7, hi: 2.5 },
  2: { label: 'Pas sûr·e', hint: 'Fait une fois, ou il y a longtemps', lo: 0.75, hi: 1.8 },
  3: { label: 'Déjà fait', hint: 'Je l’ai déjà fait quelques fois', lo: 0.8, hi: 1.5 },
  4: { label: 'À l’aise', hint: 'Je le fais souvent', lo: 0.85, hi: 1.3 },
  5: { label: 'Je maîtrise', hint: 'Je pourrais le faire les yeux fermés', lo: 0.9, hi: 1.15 },
};

const DEFAULT_CATS = [
  { id: 'refs', name: 'Recherche & références' },
  { id: 'concept', name: 'Concept / design' },
  { id: 'blocking', name: 'Blocking' },
  { id: 'model', name: 'Modélisation' },
  { id: 'sculpt', name: 'Sculpt' },
  { id: 'retopo', name: 'Retopo & UV' },
  { id: 'texture', name: 'Texturing' },
  { id: 'rig', name: 'Rig & skin' },
  { id: 'anim', name: 'Animation' },
  { id: 'light', name: 'Lighting & rendu' },
  { id: 'integ', name: 'Intégration moteur' },
  { id: 'retours', name: 'Retours & corrections' },
  { id: 'pres', name: 'Présentation / planche' },
  { id: 'autre', name: 'Autre' },
];

const REASONS = [
  { id: 'new', label: 'Technique nouvelle', advice: 'Prévois une tâche « test / apprentissage » à part avant de te lancer : on n’estime bien que ce qu’on a déjà essayé.' },
  { id: 'complex', label: 'Plus complexe que prévu', advice: 'Avant d’estimer, fais une esquisse ou un blocking rapide (15 min) pour voir la vraie complexité.' },
  { id: 'iter', label: 'Retours / itérations', advice: 'Estime explicitement une ou deux passes de retours : elles arrivent toujours.' },
  { id: 'tech', label: 'Souci technique / logiciel', advice: 'Garde une marge « imprévus techniques » de 10 à 15 % sur ton total (crash, export, bake…).' },
  { id: 'interrupt', label: 'Interruptions', advice: 'Travaille en sessions chronométrées (ex : 50 min), notifications coupées.' },
  { id: 'polish', label: 'J’ai trop peaufiné', advice: 'Définis ton critère de « fini » avant de commencer : sans limite, le polish n’a pas de fin.' },
];

const FORGOTTEN = [
  { name: 'Recherche de références', cat: 'refs' },
  { name: 'Retours & corrections', cat: 'retours' },
  { name: 'Export & intégration', cat: 'integ' },
  { name: 'Rendu / planche de présentation', cat: 'pres' },
];

/* ================== OUTILS ================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => Date.now();

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// minutes -> "1h30", "45 min", "12h"
function fmtMin(min, opts = {}) {
  if (min == null || !isFinite(min)) return '—';
  let m = Math.round(min);
  if (opts.round5 && m > 90) m = Math.round(m / 5) * 5;
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h${String(r).padStart(2, '0')}` : `${h}h`;
}
// ms -> "1:02:15"
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}
function fmtRatio(r) {
  if (r == null || !isFinite(r)) return '—';
  return '×' + String(parseFloat(r.toFixed(2))).replace('.', ',');
}
function fmtPct(p, signed = true) {
  if (p == null || !isFinite(p)) return '—';
  const v = Math.round(p * 100);
  return (signed && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + ' %';
}
function fmtDate(ts, long = false) {
  if (!ts) return '';
  const d = new Date(ts);
  return long
    ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}
function plural(n, one, many) { return n + ' ' + (n > 1 ? many : one); }

// "1h30" | "90min" | "1,5" | "1.5h" | "2j" | "1:30" | "45 m" -> minutes
function parseDur(str) {
  if (str == null) return null;
  let s = String(str).trim().toLowerCase().replace(',', '.').replace(/\s+/g, '');
  if (!s) return null;
  let m;
  if ((m = s.match(/^(\d+(?:\.\d+)?)(?:j|jour|jours|d)$/))) return pos(parseFloat(m[1]) * DAY_MIN);
  if ((m = s.match(/^(\d+)h(\d{1,2})(?:m|min)?$/))) return pos(+m[1] * 60 + +m[2]);
  if ((m = s.match(/^(\d+(?:\.\d+)?)h$/))) return pos(parseFloat(m[1]) * 60);
  if ((m = s.match(/^(\d+)(?:m|mn|min|mins|minutes?)$/))) return pos(+m[1]);
  if ((m = s.match(/^(\d+):(\d{2})$/))) return pos(+m[1] * 60 + +m[2]);
  if ((m = s.match(/^(\d+(?:\.\d+)?)$/))) return pos(parseFloat(m[1]) * 60); // nombre seul = heures
  return null;
  function pos(v) { return v > 0 && v < 100000 ? Math.round(v) : null; }
}

/* ================== ÉTAT & SAUVEGARDE (CLIENT / SERVEUR) ================== */
const ARTIST_KEY = 'carnet-de-prod:active-artist';
let currentArtist = null;
let serverSyncOK = true;
let isSaving = false;
let storageOK = true;

function freshState() {
  return { v: 1, student: currentArtist ? currentArtist.name : '', categories: DEFAULT_CATS.map(c => ({ ...c })), projects: [], timer: null, lastExport: null, created: now() };
}

function normalize(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.projects)) throw new Error('format');
  const base = freshState();
  const out = Object.assign(base, s);
  if (!Array.isArray(out.categories) || !out.categories.length) out.categories = DEFAULT_CATS.map(c => ({ ...c }));
  out.projects.forEach(p => {
    p.tasks = Array.isArray(p.tasks) ? p.tasks : [];
    p.status = p.status || 'plan';
    p.tasks.forEach(t => {
      t.spent = +t.spent || 0;
      t.conf = clamp(+t.conf || 3, 1, 5);
      t.status = t.status || 'todo';
      t.reasons = Array.isArray(t.reasons) ? t.reasons : [];
      if (t.planned == null) t.planned = true;
    });
  });
  if (out.timer && !findTask(out, out.timer.pid, out.timer.tid)) out.timer = null;
  return out;
}

function updateArtistBadge() {
  const btn = $('#artistBtn');
  const nameEl = $('#artistNameDisplay');
  const avatarEl = $('#artistAvatar');
  if (!nameEl) return;
  if (currentArtist) {
    nameEl.textContent = currentArtist.name;
    avatarEl.textContent = currentArtist.name.slice(0, 1).toUpperCase();
    if (btn) btn.title = 'Connecté en tant que ' + currentArtist.name + ' (cliquer pour changer)';
  } else {
    nameEl.textContent = 'Choisir un profil';
    avatarEl.textContent = '?';
    if (btn) btn.title = 'Sélectionner ou créer un profil artiste';
  }
}

async function fetchArtists() {
  try {
    const res = await fetch('/api/artists');
    if (!res.ok) throw new Error();
    return await res.json();
  } catch (_) { return null; }
}

async function loadArtistState(artistId) {
  try {
    const res = await fetch('/api/artists/' + encodeURIComponent(artistId) + '/state');
    if (res.status === 404) return null;
    if (!res.ok) throw new Error();
    return await res.json();
  } catch (_) {
    try {
      const raw = localStorage.getItem(STORE_KEY + ':' + artistId);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
}

async function selectArtist(artist, stateData = null) {
  currentArtist = artist;
  try { localStorage.setItem(ARTIST_KEY, JSON.stringify(artist)); } catch (_) {}
  updateArtistBadge();

  if (stateData) {
    state = normalize(stateData);
  } else {
    const loaded = await loadArtistState(artist.id);
    state = loaded ? normalize(loaded) : freshState();
    if (!state.student) state.student = artist.name;
  }
  closeModal();
  await Promise.all([fetchTeams(true), fetchAllTasks(true)]).catch(() => {});
  render();
  saveNow();
}

let state = freshState();

function findTask(s, pid, tid) {
  const p = s.projects.find(x => x.id === pid);
  return p ? p.tasks.find(t => t.id === tid) : null;
}
const getProject = id => state.projects.find(p => p.id === id);
const catName = id => (state.categories.find(c => c.id === id) || { name: 'Sans catégorie' }).name;

/* ================== CALCULS ================== */
function isRunning(t) { return !!(state.timer && state.timer.tid === t.id); }
function spentMs(t) { return t.spent + (isRunning(t) ? now() - state.timer.since : 0); }
function actualMin(t) { return spentMs(t) / 60000; }
function rangeOf(t) {
  if (!t.est) return [null, null];
  const c = CONF[t.conf] || CONF[3];
  return [t.est * c.lo, t.est * c.hi];
}
// 'in' | 'over' | 'under' (null si pas d'estimation)
function classify(t) {
  if (!t.est) return null;
  const [lo, hi] = rangeOf(t);
  const a = actualMin(t);
  if (a > hi) return 'over';
  if (a < lo) return 'under';
  return 'in';
}

function projectStats(p) {
  const active = p.tasks.filter(t => t.status !== 'cut');
  const planned = active.filter(t => t.planned);
  const unplanned = p.tasks.filter(t => !t.planned);
  const cut = p.tasks.filter(t => t.status === 'cut');
  const done = p.tasks.filter(t => t.status === 'done' && t.est > 0);
  const estTotal = sum(active, t => t.est);
  const lowTotal = sum(active, t => rangeOf(t)[0]);
  const highTotal = sum(active, t => rangeOf(t)[1]);
  const plannedTotal = sum(planned, t => t.est);
  const actualTotal = sum(p.tasks, t => actualMin(t));
  const ratio = plannedTotal > 0 && actualTotal > 0 ? actualTotal / plannedTotal : null;
  const inRange = done.filter(t => classify(t) === 'in').length;
  const hitRate = done.length ? inRange / done.length : null;
  const mape = done.length ? sum(done, t => Math.abs(actualMin(t) / t.est - 1)) / done.length : null;
  const unplannedTime = sum(unplanned.filter(t => t.status !== 'cut'), t => actualMin(t));
  return { active, planned, unplanned, cut, done, estTotal, lowTotal, highTotal, plannedTotal, actualTotal, ratio, inRange, hitRate, mape, unplannedTime };
}

function finishedProjects(excludeId, before) {
  return state.projects
    .filter(p => p.status === 'done' && p.id !== excludeId && (!before || (p.finishedAt || 0) < before))
    .sort((a, b) => (a.finishedAt || 0) - (b.finishedAt || 0));
}

// Coefficient perso = temps réel total ÷ temps prévu au découpage, sur les 5 derniers projets terminés
function personalCoef(excludeId) {
  const fin = finishedProjects(excludeId).slice(-5);
  let a = 0, e = 0, n = 0;
  fin.forEach(p => { const s = projectStats(p); if (s.ratio) { a += s.actualTotal; e += s.plannedTotal; n++; } });
  return n && e ? { coef: a / e, n } : null;
}

// Par catégorie, sur tous les projets terminés : { catId: {a, e, n, ratio} }
function catStats(excludeId, before) {
  const map = {};
  finishedProjects(excludeId, before).forEach(p => {
    projectStats(p).done.forEach(t => {
      const k = t.cat || 'autre';
      map[k] = map[k] || { a: 0, e: 0, n: 0, hit: 0 };
      map[k].a += actualMin(t); map[k].e += t.est; map[k].n++;
      if (classify(t) === 'in') map[k].hit++;
    });
  });
  Object.values(map).forEach(v => v.ratio = v.a / v.e);
  return map;
}

// Par niveau de confiance : { 1..5: {n, hit, a, e} }
function confStats() {
  const map = {};
  for (let i = 1; i <= 5; i++) map[i] = { n: 0, hit: 0, a: 0, e: 0, over: 0, under: 0 };
  finishedProjects().forEach(p => {
    projectStats(p).done.forEach(t => {
      const m = map[t.conf]; const c = classify(t);
      m.n++; m.a += actualMin(t); m.e += t.est;
      if (c === 'in') m.hit++; else if (c === 'over') m.over++; else m.under++;
    });
  });
  return map;
}

/* ================== BILAN : analyse & conseils ================== */
// tone : 'bad' | 'warn' | 'info' | 'good'
const TONE_RANK = { bad: 0, warn: 1, info: 2, good: 3 };

function buildReport(p) {
  const s = projectStats(p);
  const F = [];
  const done = s.done;
  const R = s.ratio;
  const catsHist = catStats(p.id, p.finishedAt || now());

  // 1. Biais global
  if (R != null) {
    const pct = R - 1;
    if (R > 1.5) {
      F.push({ tone: 'bad', tag: 'Global', title: 'Grosse sous-estimation',
        text: `Le projet a pris ${fmtMin(s.actualTotal)} au lieu des ${fmtMin(s.plannedTotal)} prévues au découpage, soit ${fmtRatio(R)} le temps prévu.`,
        action: `La prochaine fois, découpe plus fin (tâches de 1 à 3h) et multiplie ton total brut par ${fmtRatio(R)} avant de t’engager sur un délai.`, w: 10 });
    } else if (R > 1.15) {
      F.push({ tone: 'warn', tag: 'Global', title: 'Légère sous-estimation',
        text: `Ton projet a pris ${fmtPct(pct)} de temps en plus que prévu (${fmtMin(s.actualTotal)} au lieu de ${fmtMin(s.plannedTotal)}).`,
        action: `Ajoute une marge de sécurité d’environ ${Math.round(pct * 100)} % à ton prochain total : c’est ta marge réelle, pas une option.`, w: 8 });
    } else if (R >= 0.85) {
      F.push({ tone: 'good', tag: 'Global', title: 'Estimation globale réussie',
        text: `Tu es tombé·e à ${Math.abs(Math.round(pct * 100))} % près : ${fmtMin(s.actualTotal)} pour ${fmtMin(s.plannedTotal)} prévues. Bravo !`,
        action: 'Garde ta méthode de découpage, elle fonctionne. Essaie maintenant de resserrer ta confiance tâche par tâche.', w: 2 });
    } else {
      F.push({ tone: 'info', tag: 'Global', title: 'Plus rapide que prévu',
        text: `Le projet a pris ${fmtMin(s.actualTotal)} au lieu de ${fmtMin(s.plannedTotal)} (${fmtPct(pct)}). Tu es plus efficace que tu ne le penses.`,
        action: 'Réduis un peu tes estimations sur ce type de travail : un planning trop large a tendance à se remplir tout seul (loi de Parkinson).', w: 6 });
    }
  }

  // 2. Erreurs qui se compensent
  if (R != null && R >= 0.85 && R <= 1.15 && done.length >= 3 && s.mape > 0.35) {
    F.push({ tone: 'warn', tag: 'Précision', title: 'Des erreurs qui se compensent',
      text: `Le total tombe juste, mais tâche par tâche tu te trompes de ${Math.round(s.mape * 100)} % en moyenne : des dépassements et des tâches plus rapides s’annulent.`,
      action: 'Regarde le graphique tâche par tâche : c’est là que tu peux vraiment progresser. Ne compte pas sur la chance la prochaine fois.', w: 7 });
  }

  // 3. Catégories : la plus piégeuse / la plus fiable
  const byCat = {};
  done.forEach(t => {
    const k = t.cat || 'autre';
    byCat[k] = byCat[k] || { a: 0, e: 0, n: 0 };
    byCat[k].a += actualMin(t); byCat[k].e += t.est; byCat[k].n++;
  });
  const cats = Object.entries(byCat).map(([k, v]) => ({ k, ...v, r: v.a / v.e }));
  const worst = cats.filter(c => c.r >= 1.3).sort((a, b) => (b.a - b.e) - (a.a - a.e))[0];
  if (worst) {
    const hist = catsHist[worst.k];
    const again = hist && hist.n >= 2 && hist.ratio >= 1.25;
    F.push({ tone: worst.r >= 1.6 ? 'bad' : 'warn', tag: 'Catégorie', title: `Catégorie piège : ${catName(worst.k)}`,
      text: `${catName(worst.k)} : ${fmtMin(worst.a)} au lieu de ${fmtMin(worst.e)} (${fmtRatio(worst.r)}).` + (again ? ` Et ce n’est pas la première fois : sur tes projets précédents c’était déjà ${fmtRatio(hist.ratio)}.` : ''),
      action: `Pour les tâches « ${catName(worst.k)} », multiplie ton intuition par ${fmtRatio(worst.r)} — ou découpe-les en sous-étapes (préparation, passe principale, détails).`, w: again ? 9 : 7 });
  }
  const best = cats.filter(c => c.n >= 2 && Math.abs(c.r - 1) <= 0.12).sort((a, b) => b.n - a.n)[0];
  if (best) {
    F.push({ tone: 'good', tag: 'Point fort', title: `Tu estimes bien : ${catName(best.k)}`,
      text: `Sur ${plural(best.n, 'tâche', 'tâches')} « ${catName(best.k)} », tu es à ${Math.round(Math.abs(best.r - 1) * 100)} % près.`,
      action: null, w: 1 });
  }

  // 4. Calibration de la confiance
  const high = done.filter(t => t.conf >= 4);
  const highMiss = high.filter(t => classify(t) !== 'in');
  if (high.length >= 2 && highMiss.length / high.length >= 0.5) {
    F.push({ tone: 'warn', tag: 'Confiance', title: 'Excès de confiance',
      text: `Sur les tâches où tu te sentais à l’aise (confiance 4-5), tu es sorti·e de ta fourchette ${highMiss.length} fois sur ${high.length}.`,
      action: 'Quand tu te sentes sûr·e de toi, pose-toi la question : ai-je déjà fait exactement ça, avec ce niveau de détail et ce logiciel ? Sinon, baisse ta confiance d’un cran.', w: 7 });
  }
  const low = done.filter(t => t.conf <= 2);
  const lowHit = low.filter(t => classify(t) === 'in');
  if (low.length >= 2 && lowHit.length / low.length >= 0.75) {
    F.push({ tone: 'good', tag: 'Confiance', title: 'Tu peux te faire plus confiance',
      text: `Même sur les tâches où tu doutais (confiance 1-2), tu es tombé·e dans ta fourchette ${lowHit.length} fois sur ${low.length}.`,
      action: 'Sur ce type de tâche, tu peux monter ta confiance d’un cran : ta fourchette sera plus serrée et ton planning plus utile.', w: 3 });
  }
  if (done.length >= 3 && s.hitRate >= 0.75 && !F.some(f => f.tag === 'Confiance')) {
    F.push({ tone: 'good', tag: 'Confiance', title: 'Des fourchettes réalistes',
      text: `${s.inRange} tâches sur ${done.length} sont tombées dans ta fourchette. Ta confiance est bien réglée.`, action: null, w: 1 });
  }

  // 5. Tâches trop grosses
  const big = done.filter(t => t.est > 240);
  const small = done.filter(t => t.est <= 240);
  if (big.length) {
    const errBig = sum(big, t => Math.abs(actualMin(t) / t.est - 1)) / big.length;
    const errSmall = small.length ? sum(small, t => Math.abs(actualMin(t) / t.est - 1)) / small.length : null;
    const slipped = big.filter(t => actualMin(t) / t.est > 1.3);
    const worseThanSmall = errSmall != null && errBig > errSmall + 0.15;
    if (slipped.length || worseThanSmall) {
      const worstBig = big.slice().sort((a, b) => actualMin(b) / b.est - actualMin(a) / a.est)[0];
      F.push({ tone: 'warn', tag: 'Découpage', title: 'Des tâches trop grosses',
        text: worseThanSmall
          ? `Tes tâches de plus de 4h ont un écart moyen de ${Math.round(errBig * 100)} %, contre ${Math.round(errSmall * 100)} % pour les plus petites.`
          : `${slipped.length > 1 ? slipped.length + ' tâches de plus de 4h ont' : 'Une tâche de plus de 4h a'} dérapé de plus de 30 % (« ${worstBig.name} » : ${fmtPct(actualMin(worstBig) / worstBig.est - 1)}).`,
        action: 'Découpe toute tâche de plus d’une demi-journée en étapes de 1 à 3h (ex : blocking → formes principales → détails → nettoyage).', w: 6 });
    }
  }

  // 6. Tâches oubliées
  const forgot = s.unplanned.filter(t => t.status !== 'cut');
  if (forgot.length) {
    const share = s.actualTotal ? s.unplannedTime / s.actualTotal : 0;
    F.push({ tone: share >= 0.15 ? 'bad' : 'warn', tag: 'Découpage', title: forgot.length > 1 ? `${forgot.length} tâches oubliées au découpage` : 'Une tâche oubliée au découpage',
      text: `Ajoutée${forgot.length > 1 ? 's' : ''} en cours de route : ${forgot.map(t => '« ' + t.name + ' »').join(', ')}. Cela représente ${fmtMin(s.unplannedTime)}, soit ${Math.round(share * 100)} % du temps total.`,
      action: `Au prochain découpage, pense dès le début à : ${forgot.map(t => t.name.toLowerCase()).join(', ')}.`, w: share >= 0.15 ? 9 : 6 });
  }

  // 7. Scope coupé
  if (s.cut.length) {
    F.push({ tone: 'info', tag: 'Scope', title: `${plural(s.cut.length, 'tâche coupée', 'tâches coupées')} du scope`,
      text: `${s.cut.map(t => '« ' + t.name + ' »').join(', ')}. Couper du scope est un bon réflexe quand le temps manque ; l’important est de le décider tôt, pas la veille du rendu.`,
      action: null, w: 2 });
  }

  // 8. Causes de dépassement citées
  const rc = {};
  p.tasks.forEach(t => (t.reasons || []).forEach(r => rc[r] = (rc[r] || 0) + 1));
  const topR = Object.entries(rc).sort((a, b) => b[1] - a[1]).slice(0, 2);
  topR.forEach(([id, n], i) => {
    const r = REASONS.find(x => x.id === id); if (!r) return;
    F.push({ tone: 'warn', tag: 'Ce qui t’a ralenti·e', title: r.label, text: `Cité${n > 1 ? ' ' + n + ' fois' : ' une fois'} dans tes tâches qui ont dépassé.`, action: r.advice, w: 5 + n - i });
  });

  // 9. Temps disponible
  if (p.available && s.actualTotal > p.available) {
    F.push({ tone: 'bad', tag: 'Délai', title: 'Temps disponible dépassé',
      text: `Tu avais ${fmtMin(p.available)} de disponibles, tu as passé ${fmtMin(s.actualTotal)}.`,
      action: 'Avant de lancer la prod, compare ta fourchette haute à ton temps disponible, et note à l’avance ce que tu couperais en cas de retard.', w: 8 });
  }

  // 10. Rien à analyser
  if (!done.length) {
    F.push({ tone: 'info', tag: 'Info', title: 'Pas encore de tâche terminée', text: 'Termine au moins une tâche pour obtenir une analyse.', action: null, w: 0 });
  }

  F.sort((a, b) => TONE_RANK[a.tone] - TONE_RANK[b.tone] || b.w - a.w);
  const actions = F.filter(f => f.action).sort((a, b) => b.w - a.w).slice(0, 3).map(f => f.action);
  return { s, findings: F, actions };
}

// Quelques phrases de synthèse pour le tableau de bord
function globalInsights() {
  const out = [];
  const cs = catStats();
  const worst = Object.entries(cs).filter(([, v]) => v.n >= 2 && v.ratio >= 1.2).sort((a, b) => b[1].ratio - a[1].ratio)[0];
  if (worst) out.push({ tone: 'warn', text: `Ta catégorie piège : <b>${esc(catName(worst[0]))}</b> (${fmtRatio(worst[1].ratio)} en moyenne sur ${worst[1].n} tâches).` });
  const best = Object.entries(cs).filter(([, v]) => v.n >= 2).sort((a, b) => Math.abs(a[1].ratio - 1) - Math.abs(b[1].ratio - 1))[0];
  if (best && Math.abs(best[1].ratio - 1) <= 0.15) out.push({ tone: 'good', text: `Ton point fort : <b>${esc(catName(best[0]))}</b>, estimé à ${Math.round(Math.abs(best[1].ratio - 1) * 100)} % près.` });
  const cf = confStats();
  const hi = { n: cf[4].n + cf[5].n, hit: cf[4].hit + cf[5].hit };
  if (hi.n >= 3) {
    const r = hi.hit / hi.n;
    out.push({ tone: r < 0.6 ? 'warn' : 'good', text: r < 0.6
      ? `Quand tu te sens « à l’aise », tu tombes juste seulement <b>${Math.round(r * 100)} %</b> du temps : méfie-toi de ta confiance.`
      : `Quand tu te sens « à l’aise », tu tombes juste <b>${Math.round(r * 100)} %</b> du temps : ta confiance est fiable.` });
  }
  return out;
}

function catOptions(sel) {
  return state.categories.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}

function confPicker(t, ro = false) {
  const c = CONF[t.conf] || CONF[3];
  if (ro) {
    return `<span class="conf ro" title="Confiance ${t.conf}/5 : ${esc(c.label)}">${[1, 2, 3, 4, 5].map(i => `<span class="${i <= t.conf ? 'on' : ''}"></span>`).join('')}</span><span class="conf-label">${esc(c.label)}</span>`;
  }
  return `<div class="conf" role="radiogroup" aria-label="Confiance">${[1, 2, 3, 4, 5].map(i =>

}

// Piste « fourchette / estimation / réel »
function trackInner({ est, lo, hi, a, cls, max }) {
  max = max || Math.max(hi || 0, a || 0, est || 0) * 1.08 || 1;
  const pc = v => clamp(v / max * 100, 0, 100).toFixed(2) + '%';
  let h = '<div class="rail"></div>';
  if (lo != null && hi != null) h += `<div class="band" style="left:${pc(lo)};width:calc(${pc(hi)} - ${pc(lo)})"></div>`;
  if (a > 0) h += `<div class="bar ${cls || ''}" style="width:${pc(a)}"></div>`;
  if (est) h += `<div class="tick" style="left:${pc(est)}"></div>`;
  return h;
}
function taskTrackInner(t, max) {
  const [lo, hi] = rangeOf(t);
  const a = actualMin(t);
  let cls = '';
  if (t.status === 'done') cls = classify(t);
  else if (a > hi) cls = 'over';
  return trackInner({ est: t.est, lo, hi, a, cls, max: max || Math.max(hi || 0, a) * 1.08 });
}
function taskAria(t) {
  const [lo, hi] = rangeOf(t);
  return `Estimé ${fmtMin(t.est)}, fourchette ${fmtMin(lo)} à ${fmtMin(hi)}, réel ${fmtMin(actualMin(t))}`;
}
function projTrackInner(p, s = projectStats(p)) {
  const lo = sum(s.planned, t => rangeOf(t)[0]);
  const hi = sum(s.planned, t => rangeOf(t)[1]);
  const a = s.actualTotal;
  return trackInner({ est: s.plannedTotal, lo, hi, a, cls: p.status === 'done' ? (a > hi ? 'over' : a < lo ? 'under' : 'in') : (a > hi ? 'over' : ''), max: Math.max(hi, a) * 1.08 });
}
function trackLegend(done = true) {
  return `<div class="legend">
    <span class="k"><span class="k-band"></span>ta fourchette</span>
    <span class="k"><span class="k-tick"></span>ton estimation</span>
    ${done
      ? `<span class="k"><span class="k-bar" style="background:var(--ok)"></span>réel, dans la fourchette</span><span class="k"><span class="k-bar" style="background:var(--miss)"></span>réel, hors fourchette</span>`
      : `<span class="k"><span class="k-bar" style="background:var(--run)"></span>temps passé</span><span class="k"><span class="k-bar" style="background:var(--miss)"></span>au-delà de la fourchette</span>`}
  </div>`;
}
function resultBadge(t, short = false) {
  const c = classify(t); if (!c) return '';
  const d = actualMin(t) / t.est - 1;
  if (c === 'in') return `<span class="badge" title="Dans ta fourchette"><span class="sw sw-ok"></span>✓ ${short ? 'juste' : 'Dans ta fourchette'} · ${fmtPct(d)}</span>`;
  if (c === 'over') return `<span class="badge" title="Plus long que ta fourchette"><span class="sw sw-miss"></span>▲ ${short ? 'plus long' : 'Plus long que prévu'} · ${fmtPct(d)}</span>`;
  return `<span class="badge" title="Plus rapide que ta fourchette"><span class="sw sw-miss"></span>▼ ${short ? 'plus rapide' : 'Plus rapide que prévu'} · ${fmtPct(d)}</span>`;
}

/* ================== BANNIÈRES ================== */
function banners() {
  let h = '';
  if (!storageOK) h += `<div class="banner warn no-print">${ic('alert')}<span><b>La sauvegarde automatique ne fonctionne pas</b> dans ce navigateur (mode privé ?). Pense à exporter un fichier avant de fermer.</span><span class="spacer"></span><button class="btn btn-sm" data-act="export">${ic('download')} Exporter</button></div>`;
  if (state.timer) {
    const t = findTask(state, state.timer.pid, state.timer.tid);
    const run = now() - state.timer.since;
    if (t && run > 3 * 3600000 && !state.timer.ack) {
      h += `<div class="banner warn no-print">${ic('clock')}<span>Ton chrono sur <b>${esc(t.name)}</b> tourne depuis <b>${fmtMin(run / 60000)}</b>. Un oubli ?</span><span class="spacer"></span><button class="btn btn-sm" data-act="timer-keep">C’est normal</button><button class="btn btn-sm" data-act="timer-discard">Ne pas compter cette session</button></div>`;
    }
  }
  if (state.projects.some(p => p.demo)) {
    h += `<div class="banner no-print">${ic('info')}<span>Tu regardes des <b>projets d’exemple</b> pour découvrir l’outil.</span><span class="spacer"></span><button class="btn btn-sm" data-act="demo-remove">Retirer les exemples</button></div>`;
  }
  const real = state.projects.filter(p => !p.demo);
  const ref = state.lastExport || state.created || now();
  if (storageOK && real.some(p => p.tasks.length) && now() - ref > 7 * 86400000) {
    h += `<div class="banner no-print">${ic('download')}<span>${state.lastExport ? `Dernier export il y a ${Math.floor((now() - state.lastExport) / 86400000)} jours.` : 'Tu n’as encore jamais exporté tes données.'} Un petit fichier de sauvegarde, au cas où ?</span><span class="spacer"></span><button class="btn btn-sm" data-act="export">${ic('download')} Exporter</button></div>`;
  }
  return h;
}

  if (!ps.length) {
    return head + `<section class="card empty">
      ${DOODLE_EMPTY}
      <h2>Ton carnet est vide</h2>
      <p class="muted">Pour chaque projet : <b>1.</b> découpe-le en tâches et estime-les, <b>2.</b> chronomètre ton travail, <b>3.</b> lis ton bilan pour savoir quoi améliorer la prochaine fois.</p>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary btn-big" data-act="new-project">${ic('plus')} Créer mon premier projet</button>

      </div>

  }
  const groups = [['wip', 'En production'], ['plan', 'En découpage'], ['done', 'Terminés']];
  let h = head;
  groups.forEach(([st, label]) => {

  });
  return h;
}

  if (p.status === 'plan') {
    body = `<div><span class="big">${s.estTotal ? fmtMin(s.estTotal) : '—'}</span> <span class="muted">estimées</span></div>

  } else if (p.status === 'wip') {

    body = `<div class="row" style="gap:8px"><span class="big">${fmtRatio(s.ratio)}</span><span class="muted small">prévu ${fmtMin(s.plannedTotal)} → réel ${fmtMin(s.actualTotal)}</span></div>

    <span class="status ${p.status}">${STATUS_LABEL[p.status]}</span>

    ${body}
  </a>`;
}

/* ================== PAGE : PROJET ================== */
function viewProject(p) {
  const idx = { plan: 0, wip: 1, done: 2 }[p.status];
  const steps = ['Découper & estimer', 'Produire', 'Bilan'];
  const stepper = `<nav class="stepper" aria-label="Étapes du projet">${steps.map((s, i) => `${i ? '<span class="step-sep" aria-hidden="true"></span>' : ''}<span class="step ${i === idx ? 'cur' : i < idx ? 'past' : ''}" ${i === idx ? 'aria-current="step"' : ''}><span class="n">${i < idx ? '✓' : i + 1}</span>${s}</span>`).join('')}</nav>`;
  const head = `<a class="back no-print" href="#/projets">${ic('left')} Mes projets</a>
    <div class="print-only small muted">${state.student ? esc(state.student) + ' · ' : ''}Bilan imprimé le ${fmtDate(now(), true)}</div>
    <textarea class="title-input" rows="1" data-key="p-name" data-field="p.name" aria-label="Nom du projet" placeholder="Nom du projet" spellcheck="false">${esc(p.name)}</textarea>
    ${stepper}`;
  let body = p.status === 'plan' ? viewPlan(p) : p.status === 'wip' ? viewProd(p) : viewDone(p);
  body += `<div class="row no-print" style="margin-top:40px;justify-content:flex-end"><button class="btn btn-ghost btn-sm btn-danger" data-act="delete-project">${ic('trash')} Supprimer ce projet</button></div>`;
  return head + body;
}

/* ---------- Étape 1 : découper ---------- */
function planVerdict(p, s, coef) {
  const missing = p.tasks.filter(t => !t.est).length;
  if (!p.tasks.length) return `<div class="verdict">${ic('info')}<span>Ajoute tes premières tâches à gauche.</span></div>`;
  if (missing) return `<div class="verdict">${ic('alert')}<span>Il manque une estimation sur ${plural(missing, 'tâche', 'tâches')}.</span></div>`;
  if (!p.available) return `<div class="verdict">${ic('bulb')}<span>Indique ton temps disponible pour vérifier que le projet rentre.</span></div>`;
  const exp = s.estTotal * (coef ? Math.max(1, coef.coef) : 1);
  if (s.highTotal <= p.available && exp <= p.available) return `<div class="verdict">${ic('check')}<span><b>Ça rentre</b>, même si tout se passe mal (fourchette haute : ${fmtMin(s.highTotal)}).</span></div>`;
  if (exp <= p.available) return `<div class="verdict">${ic('alert')}<span><b>Ça rentre si tout va bien</b>, mais ta fourchette haute (${fmtMin(s.highTotal)}) dépasse ton temps dispo. Note dès maintenant ce que tu couperais.</span></div>`;
  return `<div class="verdict" style="box-shadow:inset 4px 0 0 var(--miss)">${ic('alert')}<span><b>Ça ne rentre pas</b> : ${coef && coef.coef > 1 ? 'avec ton coef perso, ' : ''}il te faudrait ~${fmtMin(exp, { round5: true })} pour ${fmtMin(p.available)} dispo. Réduis le scope avant de commencer.</span></div>`;
}
function planRowHint(t, hist) {
  const out = [];
  const h = hist[t.cat];
  if (h && h.n >= 2 && Math.abs(h.ratio - 1) >= 0.15) {
    out.push(`<span>${ic('clock')} Historique « ${esc(catName(t.cat))} » : ${h.ratio > 1 ? 'ça te prend en général' : 'tu vas en général plus vite,'} <b>${fmtRatio(h.ratio)}</b> ton estimation</span>`);
  }
  if (t.est > 240) out.push(`<span>${ic('alert')} Plus de 4h : essaie de la découper en 2 ou 3 étapes.</span>`);
  return out.join('');
}
function planRow(t, hist) {
  const [lo, hi] = rangeOf(t);
  return `<div class="trow" data-row="${t.id}">
    <input class="input t-name" data-key="n-${t.id}" data-field="t.name" data-tid="${t.id}" value="${esc(t.name)}" placeholder="Nom de la tâche" aria-label="Nom de la tâche" autocomplete="off">
    <select class="input t-cat" data-key="c-${t.id}" data-field="t.cat" data-tid="${t.id}" aria-label="Catégorie">${catOptions(t.cat)}</select>
    <div class="t-est"><input class="input" data-key="e-${t.id}" data-field="t.est" data-tid="${t.id}" value="${t.est ? fmtMin(t.est) : ''}" placeholder="ex : 1h30" aria-label="Estimation de durée" autocomplete="off"><div class="small faint range-txt" data-range="${t.id}" style="margin-top:3px;padding-left:3px">${t.est ? fmtMin(lo) + ' – ' + fmtMin(hi) : 'combien de temps ?'}</div></div>
    <div class="t-conf" title="À quel point es-tu sûr·e de ton estimation ?">${confPicker(t)}</div>
    <button class="btn btn-ghost icon-btn btn-sm" data-act="open-push-to-team" data-tid="${t.id}" title="Envoyer ou copier vers une équipe" aria-label="Envoyer à une équipe">👥</button>
    <button class="btn btn-ghost icon-btn btn-sm t-del" data-act="del-task" data-tid="${t.id}" title="Supprimer la tâche" aria-label="Supprimer la tâche">${ic('trash')}</button>
    <div class="hintline" data-hint="${t.id}">${planRowHint(t, hist)}</div>
  </div>`;
}

        <div style="margin-top:12px">
        ${coef
          ? `<div class="sum-line"><span>Avec ton coef perso <b>${fmtRatio(coef.coef)}</b></span><b data-sum="coef">${s.estTotal ? '~' + fmtMin(s.estTotal * coef.coef, { round5: true }) : '—'}</b></div>`
          : `<div class="sum-line"><span class="muted">Coef perso</span><span class="faint small">dispo après ton 1ᵉʳ projet terminé</span></div>`}
        <div class="sum-line" style="align-items:center"><label for="avail">Temps disponible</label><input id="avail" class="input" style="width:120px" data-key="avail" data-field="p.available" value="${p.available ? fmtMin(p.available) : ''}" placeholder="optionnel" autocomplete="off"></div>

        <p class="small faint" style="margin:8px 0 0">Une fois la prod lancée, tes estimations sont verrouillées : c’est tout l’intérêt de l’exercice.</p>
      </section>

        <h3>Les 5 niveaux de confiance</h3>
        <table class="conf-legend"><tbody>
          ${[5, 4, 3, 2, 1].map(i => `<tr><td>${confPicker({ conf: i }, true)}</td><td>−${Math.round((1 - CONF[i].lo) * 100)} % / +${Math.round((CONF[i].hi - 1) * 100)} %</td></tr>`).join('')}
        </tbody></table>
        <p class="small muted" style="margin:10px 0 0">Exemple : 2h en confiance 3 → fourchette de ${fmtMin(120 * CONF[3].lo)} à ${fmtMin(120 * CONF[3].hi)}.</p>

      <section class="card tint">

          <li>Une tâche = un résultat visible (un blocking, une texture, une planche…).</li>
          <li>N’oublie pas les <b>retours</b>, l’<b>export</b> et la <b>présentation</b>.</li>
          <li>Tu ne sais pas du tout ? Mets confiance 1 : ta fourchette sera large, et c’est honnête.</li>

      </section>
    </aside>
  </div>`;
}
// Mise à jour ciblée pendant la frappe (sans tout redessiner)
function refreshPlanComputed(p) {
  const s = projectStats(p);
  const coef = personalCoef(p.id);
  const set = (k, v) => { const el = $(`[data-sum="${k}"]`); if (el) el.innerHTML = v; };
  set('est', s.estTotal ? fmtMin(s.estTotal) : '—');
  set('range', s.estTotal ? fmtMin(s.lowTotal) + ' – ' + fmtMin(s.highTotal) : '—');
  set('coef', coef && s.estTotal ? '~' + fmtMin(s.estTotal * coef.coef, { round5: true }) : '—');
  set('verdict', planVerdict(p, s, coef));
  const btn = $('[data-act="start-prod"]');
  if (btn) btn.disabled = !(p.tasks.length && !p.tasks.some(t => !t.est || !t.name.trim()));
  p.tasks.forEach(t => {
    const r = $(`[data-range="${t.id}"]`);
    if (r) { const [lo, hi] = rangeOf(t); r.textContent = t.est ? fmtMin(lo) + ' – ' + fmtMin(hi) : 'combien de temps ?'; }
  });
}

/* ---------- Étape 2 : produire ---------- */
function prodCard(p, t) {
  const run = isRunning(t);
  const [lo, hi] = rangeOf(t);
  const a = actualMin(t);
  const cls = t.status === 'done' ? 'done' : t.status === 'cut' ? 'cut' : run ? 'running' : '';
  let actions;
  if (t.status === 'todo') {
    const started = t.spent > 0 || run;
    actions = `<button class="btn btn-sm btn-soft" data-act="adj" data-tid="${t.id}" data-v="-15" data-key="m-${t.id}" ${t.spent <= 0 && !run ? 'disabled' : ''}>−15 min</button>

      <button class="btn btn-sm btn-ghost" data-act="cut" data-tid="${t.id}" title="Retirer cette tâche du projet (manque de temps, changement de plan…)">${ic('cut')} Couper du scope</button>
      <button class="btn btn-sm ${started ? 'btn-primary' : 'btn-soft'}" data-act="done" data-tid="${t.id}" data-key="d-${t.id}">${ic('check')} Terminé</button>`;
  } else if (t.status === 'done') {
    actions = `${resultBadge(t)}<button class="btn btn-sm btn-ghost" data-act="open-push-to-team" data-tid="${t.id}" title="Transférer vers une équipe">👥 Vers équipe</button><span class="spacer"></span><button class="btn btn-sm btn-ghost" data-act="reopen-task" data-tid="${t.id}">${ic('undo')} Rouvrir</button>`;
  } else {
    actions = `<span class="tc-note">Coupée du scope</span><span class="spacer"></span><button class="btn btn-sm btn-ghost" data-act="reopen-task" data-tid="${t.id}">${ic('undo')} Remettre</button>`;

    <div class="tc-top">

        : `<span class="play" aria-hidden="true" style="background:var(--card-2);border-color:var(--line-soft);box-shadow:none;color:var(--ink-2)">${ic(t.status === 'done' ? 'check' : 'cut')}</span>`}
      <div style="min-width:0">
        <div class="tc-name">${esc(t.name)}</div>
        <div class="tc-sub"><span class="chip">${esc(catName(t.cat))}</span>${confPicker(t, true)}${!t.planned ? '<span class="chip hl">ajoutée en cours</span>' : ''}</div>
      </div>
      <div class="tc-time">
        <div class="tc-clock" data-live-time="${t.id}">${fmtClock(spentMs(t))}</div>
        <div class="tc-est">prévu <b>${fmtMin(t.est)}</b> · <span class="range-txt">${fmtMin(lo)}–${fmtMin(hi)}</span></div>
      </div>
    </div>
    <div class="tc-track"><div class="track" role="img" aria-label="${esc(taskAria(t))}" data-live-track="${t.id}">${taskTrackInner(t)}</div></div>
    <div class="tc-actions">${actions}</div>
    ${ui.editTime === t.id ? `<form class="edit-time" data-form="edit-time" data-tid="${t.id}" style="margin-top:10px">
        <label class="small" for="et-${t.id}">Temps réellement passé :</label>
        <input id="et-${t.id}" class="input" name="v" data-key="et-${t.id}" value="${fmtMin(a)}" autocomplete="off">
        <button class="btn btn-sm btn-primary" type="submit">OK</button>
        <button class="btn btn-sm btn-ghost" type="button" data-act="cancel-edit">Annuler</button>
      </form>` : ''}
    ${showWhy ? `<div class="why"><div class="small"><b>Qu’est-ce qui a pris plus de temps ?</b> <span class="faint">plusieurs choix possibles</span></div>
      <div class="chips">${REASONS.map(r => `<button class="chip" aria-pressed="${t.reasons.includes(r.id)}" data-act="reason" data-tid="${t.id}" data-v="${r.id}" data-key="r-${t.id}-${r.id}">${esc(r.label)}</button>`).join('')}</div></div>` : ''}
  </article>`;
}

/* ---------- Étape 3 : bilan ---------- */
function viewDone(p) {
  const rep = buildReport(p);
  const s = rep.s;
  const R = s.ratio;
  const tasks = p.tasks.filter(t => t.status === 'done' && t.est > 0);
  const max = Math.max(1, ...tasks.map(t => Math.max(rangeOf(t)[1], actualMin(t)))) * 1.06;
  let sentence = 'Pas assez de données pour conclure.';
  if (R != null) {
    if (R > 1.15) sentence = `Ton projet a pris <b>${Math.round((R - 1) * 100)} % de temps en plus</b> que ton découpage de départ.`;
    else if (R >= 0.85) sentence = `<b>Pile dans les temps</b>, à ${Math.round(Math.abs(R - 1) * 100)} % près. Bien joué !`;
    else sentence = `Tu as fini <b>${Math.round((1 - R) * 100)} % plus vite</b> que prévu.`;
  }
  const fIcon = tone => tone === 'good' ? ic('check') : tone === 'info' ? ic('info') : ic('alert');
  return `
  <section class="card">
    <div class="hero">
      <div>
        <div class="pv"><span class="muted">Prévu <b style="color:var(--ink)">${fmtMin(s.plannedTotal)}</b></span>${ic('right')}<span class="muted">Réel <b style="color:var(--ink)">${fmtMin(s.actualTotal)}</b></span></div>
        <div class="hero-fig">${fmtRatio(R)}</div>
        <div class="hero-sub">${sentence}</div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="tl">Dans ta fourchette</div><div class="tv">${s.inRange}/${s.done.length}</div><div class="td">tâches terminées</div></div>
        <div class="tile"><div class="tl">Écart moyen par tâche</div><div class="tv">${s.mape != null ? '±' + Math.round(s.mape * 100) + ' %' : '—'}</div><div class="td">plus c’est bas, mieux c’est</div></div>
        <div class="tile"><div class="tl">Tâches oubliées</div><div class="tv">${s.unplanned.length}</div><div class="td">${s.unplanned.length ? fmtMin(s.unplannedTime) + ' en plus' : 'bravo !'}</div></div>
        <div class="tile"><div class="tl">Coupées du scope</div><div class="tv">${s.cut.length}</div><div class="td">${s.cut.length ? 'décision de prod' : 'tout est livré'}</div></div>
      </div>
    </div>
  </section>

  <section class="card" style="margin-top:22px">
    <div class="card-head"><h2>Prévu vs réel, tâche par tâche</h2><span class="hand">la barre doit finir dans le surligné</span></div>
    <div style="margin-bottom:6px">${trackLegend(true)}</div>
