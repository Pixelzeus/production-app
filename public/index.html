let chartCfgs = {};
function viewDashboard() {
  chartCfgs = {};
  const fin = finishedProjects();
  const head = `<div class="page-head"><div><h1><span class="mark">Tableau de bord</span></h1><p class="muted" style="margin:6px 0 0">Comment tes estimations évoluent, projet après projet.</p></div></div>`;
  if (!fin.length) {
    return head + `<section class="card empty">${DOODLE_EMPTY}<h2>Rien à afficher pour l’instant</h2>
      <p class="muted">Ton tableau de bord se remplit dès que tu termines ton premier projet (étape « Bilan »).</p>
      <div class="row" style="justify-content:center"><a class="btn btn-primary" href="#/projets">Aller à mes projets</a>${state.projects.some(p => p.demo) ? '' : '<button class="btn" data-act="demo-load">Voir un exemple</button>'}</div></section>`;
  }
  const rows = fin.map(p => ({ p, s: projectStats(p) }));
  const coef = personalCoef();
  const allDone = rows.flatMap(r => r.s.done);
  const totalHit = allDone.filter(t => classify(t) === 'in').length;
  const tracked = sum(rows, r => r.s.actualTotal);
  const firstR = rows[0].s.ratio, lastR = rows[rows.length - 1].s.ratio;
  let coefTxt = '';
  if (coef) {
    const c = coef.coef;
    if (c > 1.05) coefTxt = `En moyenne, tes projets prennent <b>${Math.round((c - 1) * 100)} % de temps en plus</b> que ton découpage. Pour planifier, multiplie ton estimation par <b>${fmtRatio(c)}</b>.`;
    else if (c >= 0.95) coefTxt = 'Tes projets tombent pile sur ton découpage. Continue comme ça !';
    else coefTxt = `Tu finis en général <b>${Math.round((1 - c) * 100)} % plus vite</b> que prévu : tu peux resserrer tes estimations.`;
    coefTxt += ` <span class="faint">Calculé sur ${coef.n > 1 ? 'tes ' + coef.n + ' derniers projets' : 'ton dernier projet'}.</span>`;
  }
  const insights = globalInsights();
  if (rows.length >= 2 && firstR && lastR) {
    insights.unshift({ tone: lastR < firstR ? 'good' : 'warn', text: lastR < firstR
      ? `Tu progresses : de <b>${fmtRatio(firstR)}</b> sur ton premier projet à <b>${fmtRatio(lastR)}</b> sur le dernier.`
      : `Ton écart n’a pas diminué : <b>${fmtRatio(firstR)}</b> au premier projet, <b>${fmtRatio(lastR)}</b> au dernier.` });
  }

  // Graphique 1 : ratio réel ÷ prévu par projet
  const ys = rows.map(r => r.s.ratio || 1);
  const yMax = Math.max(1.5, Math.ceil((Math.max(...ys) + 0.1) * 4) / 4);
  const yMin = Math.min(0.5, Math.floor((Math.min(...ys) - 0.1) * 4) / 4);
  const step = yMax - yMin > 1.6 ? 0.5 : 0.25;
  const ticks = []; for (let v = Math.ceil(yMin / step) * step; v <= yMax + 1e-9; v += step) ticks.push(+v.toFixed(2));
  chartCfgs.ratio = {
    type: 'line', yMin, yMax, ticks, ref: 1, refLabel: 'pile à l’heure', zone: [0.85, 1.15], zoneLabel: 'zone juste',
    fmtTick: v => '×' + String(v).replace('.', ','), fmtVal: fmtRatio,
    aria: 'Évolution du rapport temps réel sur temps prévu, projet par projet',
    points: rows.map(r => ({ label: fmtDate(r.p.finishedAt), y: r.s.ratio || 1, title: r.p.name, lines: [`prévu ${fmtMin(r.s.plannedTotal)} → réel ${fmtMin(r.s.actualTotal)}`] })),
  };
  // Graphique 2 : % de tâches dans la fourchette
  chartCfgs.hit = {
    type: 'column', yMin: 0, yMax: 100, ticks: [0, 25, 50, 75, 100], ref: 70, refLabel: 'objectif 70 %',
    fmtTick: v => v + ' %', fmtVal: v => Math.round(v) + ' %',
    aria: 'Part des tâches tombées dans la fourchette, projet par projet',
    points: rows.map(r => ({ label: fmtDate(r.p.finishedAt), y: (r.s.hitRate || 0) * 100, title: r.p.name, lines: [`${r.s.inRange} tâches sur ${r.s.done.length} dans la fourchette`] })),
  };

  // Par catégorie (divergent)
  const cs = Object.entries(catStats()).map(([k, v]) => ({ k, ...v, d: v.ratio - 1 })).sort((a, b) => b.d - a.d);
  const dMax = Math.max(0.3, ...cs.map(c => c.d));
  const dMin = Math.min(-0.3, ...cs.map(c => c.d));
  const pos = v => ((v - dMin) / (dMax - dMin) * 100).toFixed(2) + '%';
  const w = (a, b) => ((Math.abs(b - a)) / (dMax - dMin) * 100).toFixed(2) + '%';
  const catBars = cs.map(c => `<div class="hbar" tabindex="0" data-tip-t="${esc(catName(c.k))}" data-tip-v="${esc(fmtPct(c.d))}" data-tip-l="${esc(`réel ${fmtMin(c.a)} pour ${fmtMin(c.e)} prévues|${c.n} tâches · ${c.hit} dans la fourchette`)}">
      <div class="hl-name">${esc(catName(c.k))}<small>${plural(c.n, 'tâche', 'tâches')}</small></div>
      <div class="htrack" aria-hidden="true"><div class="zone" style="left:${pos(-0.1)};width:${w(-0.1, 0.1)}"></div><div class="axis0" style="left:${pos(0)}"></div><div class="hb ${c.d >= 0 ? 'pos' : 'neg'}" style="left:${pos(Math.min(0, c.d))};width:${w(0, c.d)}"></div></div>
      <div class="hl-val"><b>${fmtPct(c.d)}</b></div>
    </div>`).join('');

  // Calibration de la confiance
  const cf = confStats();
  const confBars = [5, 4, 3, 2, 1].map(i => {
    const m = cf[i]; const r = m.n ? m.hit / m.n : null;
    return `<div class="hbar" tabindex="0" data-tip-t="Confiance ${i} · ${esc(CONF[i].label)}" data-tip-v="${r != null ? Math.round(r * 100) + ' % dans la fourchette' : 'pas encore de données'}" data-tip-l="${esc((m.n ? `${m.hit} sur ${m.n} tâches|${m.over} plus longues · ${m.under} plus rapides|` : '') + `fourchette −${Math.round((1 - CONF[i].lo) * 100)} % / +${Math.round((CONF[i].hi - 1) * 100)} %`)}">
      <div class="hl-name">${esc(CONF[i].label)}<small>niveau ${i}</small></div>
      <div class="htrack" aria-hidden="true"><div class="rail"></div>${r != null ? `<div class="hb plain" style="width:${(r * 100).toFixed(1)}%"></div>` : ''}<div class="goal" style="left:70%"></div></div>
      <div class="hl-val">${r != null ? `<b>${Math.round(r * 100)} %</b> <span class="faint">${m.hit}/${m.n}</span>` : '<span class="faint">—</span>'}</div>
    </div>`;
  }).join('');

  const table = (cols, data) => `<details class="data"><summary>Voir les données</summary><div class="dt-wrap"><table class="dt"><thead><tr>${cols.map((c, i) => `<th class="${i ? 'r' : ''}">${c}</th>`).join('')}</tr></thead><tbody>${data.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'r' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;

  return head + `
  <section class="card">
    <div class="hero">
      <div>
        <div class="lbl muted">Ton coefficient perso</div>
        <div class="hero-fig">${coef ? fmtRatio(coef.coef) : '—'}</div>
        <div class="hero-sub">${coefTxt}</div>
      </div>
      <div>
        <h3>À retenir</h3>
        <div class="findings">${insights.slice(0, 4).map(x => `<div class="finding ${x.tone}" style="padding:10px"><span class="fi">${x.tone === 'good' ? ic('check') : ic('alert')}</span><p style="margin:5px 0 0">${x.text}</p></div>`).join('') || '<p class="muted small">Termine quelques projets de plus pour voir apparaître des tendances.</p>'}</div>
      </div>
    </div>
  </section>
  <div class="tiles" style="margin:22px 0">
    <div class="tile card soft"><div class="tl">Projets terminés</div><div class="tv">${rows.length}</div></div>
    <div class="tile card soft"><div class="tl">Tâches terminées</div><div class="tv">${allDone.length}</div></div>
    <div class="tile card soft"><div class="tl">Temps chronométré</div><div class="tv">${fmtMin(tracked)}</div></div>
    <div class="tile card soft"><div class="tl">Dans la fourchette</div><div class="tv">${allDone.length ? Math.round(totalHit / allDone.length * 100) + ' %' : '—'}</div><div class="td">${totalHit} tâches sur ${allDone.length}</div></div>
  </div>
  <div class="grid-eq">
    <section class="card">
      <h2>Réel ÷ prévu, projet par projet</h2>
      <p class="small muted">×1 = pile à l’heure. Au-dessus, le projet a pris plus de temps que ton découpage.</p>
      <div class="chart" data-chart="ratio" tabindex="0" aria-label="${esc(chartCfgs.ratio.aria)}. Utilise les flèches pour parcourir."></div>
      ${table(['Projet', 'Prévu', 'Réel', 'Rapport'], rows.map(r => [esc(r.p.name), fmtMin(r.s.plannedTotal), fmtMin(r.s.actualTotal), fmtRatio(r.s.ratio)]))}
    </section>
    <section class="card">
      <h2>Tâches dans la fourchette</h2>
      <p class="small muted">Part des tâches dont le temps réel est tombé dans ta fourchette.</p>
      <div class="chart" data-chart="hit" tabindex="0" aria-label="${esc(chartCfgs.hit.aria)}. Utilise les flèches pour parcourir."></div>
      ${table(['Projet', 'Dans la fourchette', '%'], rows.map(r => [esc(r.p.name), `${r.s.inRange}/${r.s.done.length}`, r.s.hitRate != null ? Math.round(r.s.hitRate * 100) + ' %' : '—']))}
    </section>
  </div>
  <div class="grid-eq" style="margin-top:22px">
    <section class="card">
      <h2>Par catégorie</h2>
      <p class="small muted">Écart moyen entre ton estimation et le temps réel. La zone surlignée = à 10 % près.</p>
      <div class="hbars">${catBars}</div>
      <div class="axis-note" aria-hidden="true"><span>← plus rapide</span><span>plus long →</span></div>
      ${table(['Catégorie', 'Tâches', 'Prévu', 'Réel', 'Écart'], cs.map(c => [esc(catName(c.k)), c.n, fmtMin(c.e), fmtMin(c.a), fmtPct(c.d)]))}
    </section>
    <section class="card">
      <h2>Ta confiance est-elle fiable ?</h2>
      <p class="small muted">Pour chaque niveau : combien de fois tu es tombé·e dans ta fourchette. Le trait marque l’objectif de 70 %.</p>
      <div class="hbars">${confBars}</div>
      ${table(['Confiance', 'Tâches', 'Dans la fourchette', 'Plus long', 'Plus rapide'], [5, 4, 3, 2, 1].map(i => [i + ' · ' + esc(CONF[i].label), cf[i].n, cf[i].hit, cf[i].over, cf[i].under]))}
    </section>
  </div>`;
}

        <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
          <h1><span class="mark">Tableau Kanban</span></h1>
          <span class="badge badge-ok" style="font-size:.82rem;font-weight:700">👥 ${esc(activeGroup.name)}</span>
          ${artistGroups.length > 1 ? `
            <select class="input input-sm" data-act="switch-active-group" style="font-size:.82rem;font-weight:700;width:auto;cursor:pointer" title="Basculer vers un autre de vos groupes">
              ${artistGroups.map(g => `<option value="${esc(g.id)}" ${g.id === activeGroup.id ? 'selected' : ''}>Changer de groupe : 👥 ${esc(g.name)}</option>`).join('')}
            </select>
          ` : ''}
        </div>
        <p class="muted" style="margin:6px 0 0">
          Supervision de production en 3 niveaux : <b>Sprint</b> › <b>Stories</b> (éléments à produire) › <b>Tâches</b>
        </p>
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="open-create-kanban-task" data-status="todo">
          ${ic('plus')} Nouvelle tâche
        </button>
        <a class="btn btn-soft" href="#/groupes">
          ⚙️ Administration & Groupes
        </a>
      </div>
    </div>
  `;

  return head + renderKanbanBoard(activeGroup.id, groupTasks, groupMembers, groupProjects, false, true);
}

/* ============ TABLEAU KANBAN HIÉRARCHIQUE (Sprint › Story › Task) ============ */
function renderKanbanBoard(teamId, allTasks, members, projects, isSingleProject = false, isGlobalHome = false) {
  const taskList = Array.isArray(allTasks) ? allTasks : [];
  const teamMembers = Array.isArray(members) ? members : [];
  const teamProjects = Array.isArray(projects) ? projects : [];

  // 1. Recueillir la liste des Sprints disponibles
  const sprints = [];
  const seenSprints = new Set();
  taskList.forEach(t => {
    const s = (t.sprint && t.sprint.trim()) || 'Sprint Beta';
    if (!seenSprints.has(s)) {
      seenSprints.add(s);
      sprints.push(s);
    }
  });
  if (!sprints.length) sprints.push('Sprint Beta');

  // 2. Recueillir la liste des Stories disponibles (selon le sprint sélectionné)
  const stories = [];
  const seenStories = new Set();
  taskList.forEach(t => {
    if (kanbanFilterSprint === 'all' || (t.sprint || 'Sprint Beta') === kanbanFilterSprint) {
      const st = (t.story && t.story.trim()) || 'HUD';
      if (!seenStories.has(st)) {
        seenStories.add(st);
        stories.push(st);
      }
    }
  });

  // Filtrage interactif
  let filtered = taskList;
  if (kanbanFilterSprint !== 'all') {
    filtered = filtered.filter(t => (t.sprint || 'Sprint Beta') === kanbanFilterSprint);
  }
  if (kanbanFilterStory !== 'all') {
    filtered = filtered.filter(t => (t.story || 'HUD') === kanbanFilterStory);
  }
  if (!isSingleProject && kanbanFilterProject !== 'all') {
    filtered = filtered.filter(t => t.projectId === kanbanFilterProject);
  }
  if (kanbanFilterMember !== 'all') {
    if (kanbanFilterMember === 'unassigned') {
      filtered = filtered.filter(t => !t.assigneeId);
    } else {
      filtered = filtered.filter(t => t.assigneeId === kanbanFilterMember);
    }
  }
  if (kanbanFilterCat !== 'all') {
    filtered = filtered.filter(t => t.cat === kanbanFilterCat);
  }
  if (kanbanFilterSearch && kanbanFilterSearch.trim()) {
    const q = kanbanFilterSearch.trim().toLowerCase();
    filtered = filtered.filter(t =>
      (t.name && t.name.toLowerCase().includes(q)) ||
      (t.story && t.story.toLowerCase().includes(q)) ||
      (t.sprint && t.sprint.toLowerCase().includes(q)) ||
      (t.assigneeName && t.assigneeName.toLowerCase().includes(q)) ||
      (t.groupName && t.groupName.toLowerCase().includes(q))
    );
  }

  const todoTasks = filtered.filter(t => t.status === 'todo' || !t.status);
  const wipTasks = filtered.filter(t => t.status === 'wip');
  const doneTasks = filtered.filter(t => t.status === 'done');

  // Barre des onglets de Sprints
  const sprintPillsBar = `
    <div class="sprint-pills-bar" style="margin-bottom:12px">
      <span class="small faint" style="font-weight:750">🏃 Sprints :</span>
      <button class="sprint-pill ${kanbanFilterSprint === 'all' ? 'is-active' : ''}" data-act="kanban-set-sprint" data-sprint="all">
        Tous les Sprints (${taskList.length})
      </button>
      ${sprints.map(s => {
        const count = taskList.filter(x => (x.sprint || 'Sprint Beta') === s).length;
        return `
          <button class="sprint-pill ${kanbanFilterSprint === s ? 'is-active' : ''}" data-act="kanban-set-sprint" data-sprint="${esc(s)}">
            🏃 ${esc(s)} <span style="opacity:.7;font-size:.74rem">(${count})</span>
          </button>
        `;
      }).join('')}
    </div>
  `;

  // Barre de filtres
  const filterBar = `
    <div class="row" style="gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
        <input class="input input-sm" style="width:200px" data-act="kanban-search-input" value="${esc(kanbanFilterSearch)}" placeholder="🔍 Filtrer les tâches..." autocomplete="off">
        
        <select class="input input-sm" data-act="kanban-filter-story" style="font-size:.84rem" title="Filtrer par Story">
          <option value="all" ${kanbanFilterStory === 'all' ? 'selected' : ''}>📦 Toutes les stories (${stories.length})</option>
          ${stories.map(st => `<option value="${esc(st)}" ${kanbanFilterStory === st ? 'selected' : ''}>📦 ${esc(st)}</option>`).join('')}
        </select>

        ${!isSingleProject && teamProjects.length > 1 ? `
          <select class="input input-sm" data-act="kanban-filter-project" style="font-size:.84rem" title="Filtrer par projet">
            <option value="all" ${kanbanFilterProject === 'all' ? 'selected' : ''}>📁 Tous les projets (${teamProjects.length})</option>
            ${teamProjects.map(p => `<option value="${esc(p.id)}" ${kanbanFilterProject === p.id ? 'selected' : ''}>📁 ${esc(p.name)}</option>`).join('')}
          </select>
        ` : ''}

        <select class="input input-sm" data-act="kanban-filter-member" style="font-size:.84rem" title="Filtrer par personne assignée">
          <option value="all" ${kanbanFilterMember === 'all' ? 'selected' : ''}>Tous les membres (${teamMembers.length})</option>
          <option value="unassigned" ${kanbanFilterMember === 'unassigned' ? 'selected' : ''}>👤 Non assignée(s)</option>
          ${teamMembers.map(m => `<option value="${esc(m.artistId)}" ${kanbanFilterMember === m.artistId ? 'selected' : ''}>👤 ${esc(m.artistName)} ${m.role === 'lead' ? '👑' : ''}</option>`).join('')}
        </select>

        <select class="input input-sm" data-act="kanban-filter-cat" style="font-size:.84rem" title="Filtrer par catégorie">
          <option value="all" ${kanbanFilterCat === 'all' ? 'selected' : ''}>Toutes catégories</option>
          ${state.categories.map(c => `<option value="${esc(c.id)}" ${kanbanFilterCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>

        ${(kanbanFilterSprint !== 'all' || kanbanFilterStory !== 'all' || kanbanFilterGroup !== 'all' || kanbanFilterSearch || (!isSingleProject && kanbanFilterProject !== 'all') || kanbanFilterMember !== 'all' || kanbanFilterCat !== 'all') ? `
          <button class="btn btn-sm btn-ghost" data-act="kanban-reset-filters">Réinitialiser filtres</button>
        ` : ''}
      </div>

      <div>
        <button class="btn btn-sm btn-primary" data-act="open-create-team-task" ${teamId && teamId !== 'all' ? `data-tid="${esc(teamId)}"` : ''} ${isSingleProject && teamProjects[0] ? `data-pid="${esc(teamProjects[0].id)}"` : ''}>
          ${ic('plus')} Nouvelle tâche
        </button>
      </div>
    </div>
  `;

  const renderCard = (t) => {
    const running = isRunning(t);
    const spentM = actualMin(t);
    const estM = t.est || 0;
    const currentTeamId = t.teamId || t.groupId || teamId;
    const groupName = t.groupName || t.teamName || 'Groupe';
    const projName = t.projectName || (teamProjects.find(p => p.id === t.projectId) || {}).name || '';
    const sprintName = t.sprint || 'Sprint Beta';
    const storyName = t.story || 'HUD';

    return `
      <div class="kanban-card ${running ? 'is-running' : ''}" draggable="true" data-tid="${esc(t.id)}" data-pid="${esc(t.projectId)}" data-teamid="${esc(currentTeamId)}" data-status="${esc(t.status || 'todo')}">
        <div class="kanban-hierarchy-badge">
          <span class="sprint-tag" title="Sprint">🏃 ${esc(sprintName)}</span>
          <span class="sep">›</span>
          <span class="story-tag" title="Story (Élément à produire)">📦 ${esc(storyName)}</span>
        </div>

        <div class="kanban-card-title">${esc(t.name)}</div>

        <div class="kanban-card-meta">
          <div class="row" style="gap:5px;flex-wrap:wrap">
            <span class="badge" style="font-size:.72rem;padding:1px 7px" title="Groupe: ${esc(groupName)}">👥 ${esc(groupName)}</span>
            ${projName ? `<span class="badge" style="font-size:.72rem;padding:1px 7px" title="Projet: ${esc(projName)}">📁 ${esc(projName)}</span>` : ''}
            <span class="chip" style="font-size:.72rem;padding:1px 7px">${esc(catName(t.cat))}</span>
          </div>
          <span class="faint small" title="Niveau de confiance">${CONF[t.conf] ? CONF[t.conf].label : t.conf}</span>
        </div>

        <div class="row" style="justify-content:space-between;align-items:center;gap:6px;font-size:.8rem">
          <span class="member-chip mini ${t.assigneeId ? '' : 'faint'}" style="font-size:.75rem;padding:2px 7px;cursor:pointer" data-act="open-edit-team-task" data-tid="${esc(t.id)}" data-pid="${esc(t.projectId)}" data-teamid="${esc(currentTeamId)}" title="Clique pour réassigner ou modifier">
            <span class="avatar mini">${t.assigneeName ? esc(t.assigneeName.slice(0, 1).toUpperCase()) : '?'}</span>
            <span>${esc(t.assigneeName || 'Non assignée')}</span>
          </span>
          <div class="num small" style="text-align:right">
            <b data-live-time="${t.id}">${running ? fmtClock(spentMs(t)) : fmtMin(spentM)}</b>
            <span class="faint">/ ${fmtMin(estM)}</span>
          </div>
        </div>

        <div class="kanban-card-actions">
          <div class="row" style="gap:4px">
            ${t.status === 'todo' || !t.status ? `
              <button class="btn btn-sm btn-primary" data-act="kanban-set-status" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" data-status="wip">
                ▶ Commencer
              </button>
            ` : t.status === 'wip' ? `
              <button class="btn btn-sm ${running ? 'btn-primary' : 'btn-soft'} icon-btn" data-act="toggle-team-timer-direct" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" title="${running ? 'Pause' : 'Lancer le chrono'}">
                ${running ? ic('pause') : ic('play')}
              </button>
              <button class="btn btn-sm btn-ghost" data-act="adj-team-task-direct" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" data-v="15" title="+15 min">+15m</button>
              <button class="btn btn-sm btn-primary" data-act="kanban-set-status" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" data-status="done">
                ✓ Finir
              </button>
            ` : `
              <button class="btn btn-sm btn-ghost" data-act="kanban-set-status" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" data-status="wip" title="Remettre en cours">↩ En cours</button>
              <button class="btn btn-sm btn-ghost" data-act="kanban-set-status" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" data-status="todo" title="Remettre à faire">↩ À faire</button>
            `}
          </div>
          <div class="row" style="gap:2px">
            <button class="btn btn-sm btn-ghost icon-btn" data-act="open-edit-team-task" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" title="Modifier la tâche">${ic('pencil')}</button>
            <button class="btn btn-sm btn-ghost btn-danger icon-btn" data-act="del-team-task-direct" data-teamid="${esc(currentTeamId)}" data-pid="${esc(t.projectId)}" data-tid="${esc(t.id)}" title="Supprimer la tâche">${ic('trash')}</button>
          </div>
        </div>
      </div>
    `;
  };

  const boardHtml = `
    <div class="kanban-board">
      <!-- Colonne 1 : À faire -->
      <div class="kanban-col" data-col="todo" data-teamid="${esc(teamId)}">
        <div class="kanban-col-head">
          <div class="kanban-col-title">
            <span>⏳</span>
            <span>À faire</span>
          </div>
          <div class="row" style="gap:6px">
            <span class="kanban-col-badge">${todoTasks.length}</span>
            <button class="btn btn-sm btn-ghost icon-btn" data-act="open-create-kanban-task" data-status="todo" title="Ajouter une tâche à faire">${ic('plus')}</button>
          </div>
        </div>
        <div class="kanban-cards">
          ${todoTasks.length ? todoTasks.map(renderCard).join('') : '<p class="faint small" style="text-align:center;padding:24px 0">Aucune tâche à faire.<br><span style="font-size:.78rem">Glisse une tâche ici pour la planifier</span></p>'}
        </div>
        <button class="kanban-add-col-btn" data-act="open-create-kanban-task" data-status="todo">${ic('plus')} Ajouter une tâche</button>
      </div>

      <!-- Colonne 2 : En cours -->
      <div class="kanban-col" data-col="wip" data-teamid="${esc(teamId)}">
        <div class="kanban-col-head">
          <div class="kanban-col-title">
            <span>⚡</span>
            <span>En cours</span>
          </div>
          <div class="row" style="gap:6px">
            <span class="kanban-col-badge" style="background:var(--hl-soft);border-color:var(--hl);color:var(--ink)">${wipTasks.length}</span>
            <button class="btn btn-sm btn-ghost icon-btn" data-act="open-create-kanban-task" data-status="wip" title="Ajouter une tâche en cours">${ic('plus')}</button>
          </div>
        </div>
        <div class="kanban-cards">
          ${wipTasks.length ? wipTasks.map(renderCard).join('') : '<p class="faint small" style="text-align:center;padding:24px 0">Aucune tâche en cours.<br><span style="font-size:.78rem">Glisse une tâche ici pour démarrer</span></p>'}
        </div>
        <button class="kanban-add-col-btn" data-act="open-create-kanban-task" data-status="wip">${ic('plus')} Ajouter une tâche</button>
      </div>

      <!-- Colonne 3 : Terminé -->
      <div class="kanban-col" data-col="done" data-teamid="${esc(teamId)}">
        <div class="kanban-col-head">
          <div class="kanban-col-title">
            <span>✅</span>
            <span>Terminé</span>
          </div>
          <div class="row" style="gap:6px">
            <span class="kanban-col-badge" style="background:rgba(37,99,235,0.12);border-color:var(--ok);color:var(--ok)">${doneTasks.length}</span>
            <button class="btn btn-sm btn-ghost icon-btn" data-act="open-create-kanban-task" data-status="done" title="Ajouter une tâche terminée">${ic('plus')}</button>
          </div>
        </div>
        <div class="kanban-cards">
          ${doneTasks.length ? doneTasks.map(renderCard).join('') : '<p class="faint small" style="text-align:center;padding:24px 0">Aucune tâche terminée.<br><span style="font-size:.78rem">Glisse une tâche ici une fois achevée</span></p>'}
        </div>
        <button class="kanban-add-col-btn" data-act="open-create-kanban-task" data-status="done">${ic('plus')} Ajouter une tâche</button>
      </div>
    </div>
  `;

  return sprintPillsBar + filterBar + boardHtml;
}

function viewTeamDetail(teamId) {
  const t = currentTeam;
  if (!t || t.id !== teamId) {
    Promise.all([fetchTeam(teamId), fetchTeamTasks(teamId)]).then(() => renderSoon());
    return `<div class="card empty"><p class="muted">Chargement...</p></div>`;
  }
  if (currentTeamTasksTeamId !== teamId) {
    fetchTeamTasks(teamId).then(() => renderSoon());
  }

  const head = `
    <div style="margin-bottom:16px">
      <a class="back no-print" href="#/groupes">${ic('left')} Administration des groupes</a>
    </div>
    <div class="page-head">
      <div>
        <h1><span class="mark">${esc(t.name)}</span></h1>
        <p class="muted" style="margin:6px 0 0">${esc(t.description || 'Espace d’équipe de production multi-artistes.')}</p>
      </div>
      <div class="row">
        <button class="btn btn-sm btn-primary" data-act="open-create-team-task" data-tid="${esc(t.id)}">${ic('plus')} Nouvelle tâche d’équipe</button>
        <button class="btn btn-sm" data-act="edit-team" data-tid="${esc(t.id)}">${ic('pencil')} Modifier l'équipe</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-act="del-team" data-tid="${esc(t.id)}" data-tname="${esc(t.name)}">${ic('trash')} Supprimer</button>
      </div>
    </div>
  `;

  const tabsNav = `
    <div class="segmented-tabs" style="margin-top:10px;margin-bottom:20px">
      <button class="segmented-tab ${teamDetailTab === 'kanban' ? 'is-active' : ''}" data-act="set-team-tab" data-tab="kanban">
        📋 Tableau Kanban Global (${(currentTeamTasks || []).length})
      </button>
      <button class="segmented-tab ${teamDetailTab === 'projects' ? 'is-active' : ''}" data-act="set-team-tab" data-tab="projects">
        📁 Projets & Membres (${(t.projects || []).length} proj. / ${(t.members || []).length} art.)
      </button>
      <button class="segmented-tab ${teamDetailTab === 'overview' ? 'is-active' : ''}" data-act="set-team-tab" data-tab="overview">
        📊 Supervision globale
      </button>
    </div>
  `;

  // Membres
  const membersRows = (t.members || []).map(m => `
    <div class="member-item">
      <div class="row" style="gap:10px">
        <span class="avatar">${esc(m.artistName.slice(0, 1).toUpperCase())}</span>
        <div>
          <div style="font-weight:700">${esc(m.artistName)}</div>
          <div class="small faint">${m.role === 'lead' ? '👑 Lead d’équipe' : '🎨 Artiste membre'}</div>
        </div>
      </div>
      <div class="row" style="gap:6px">
        <button class="btn btn-sm btn-ghost" data-act="toggle-member-role" data-tid="${esc(t.id)}" data-aid="${esc(m.artistId)}" data-role="${m.role === 'lead' ? 'member' : 'lead'}" title="${m.role === 'lead' ? 'Passer Artiste' : 'Nommer Lead'}">
          ${m.role === 'lead' ? 'Rétrograder Artiste' : '👑 Nommer Lead'}
        </button>
        <button class="btn btn-sm btn-ghost btn-danger icon-btn" data-act="remove-team-member" data-tid="${esc(t.id)}" data-aid="${esc(m.artistId)}" data-aname="${esc(m.artistName)}" title="Retirer de l’équipe">
          ${ic('trash')}
        </button>
      </div>
    </div>
  `).join('');

  const membersSec = `
    <section class="card" style="margin-top:16px">
      <div class="row" style="margin-bottom:12px">
        <div>
          <h2 style="margin:0">Membres de l’équipe (${(t.members || []).length})</h2>
          <p class="small muted" style="margin:2px 0 0">Ces artistes peuvent être assignés aux tâches collaboratives.</p>
        </div>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-primary" data-act="open-add-member" data-tid="${esc(t.id)}">${ic('plus')} Ajouter un artiste</button>
      </div>
      <div class="members-grid">
        ${membersRows || '<p class="faint small" style="margin:8px 0">Aucun artiste dans cette équipe pour le moment. Cliquez sur "Ajouter un artiste".</p>'}
      </div>
    </section>
  `;

  // Projets collaboratifs
  const projectsRows = (t.projects || []).map(p => `
    <div class="team-proj-row">
      <div>
        <div style="font-weight:700;font-size:1.05rem">${esc(p.name)}</div>
        <div class="small muted">${esc(p.brief || 'Pas de brief')}</div>
      </div>
      <div class="row" style="gap:8px">
        <span class="badge ${p.status === 'done' ? 'badge-ok' : ''}">${p.status === 'done' ? 'Terminé' : p.status === 'wip' ? 'En cours' : 'Planification'}</span>
        <a class="btn btn-sm btn-primary" href="#/equipe/${esc(t.id)}/projet/${esc(p.id)}">Vue d’ensemble & Tâches →</a>
      </div>
    </div>
  `).join('');

  const projectsSec = `
    <section class="card" style="margin-top:20px">
      <div class="row" style="margin-bottom:12px">
        <div>
          <h2 style="margin:0">Projets collectifs (${(t.projects || []).length})</h2>
          <p class="small muted" style="margin:2px 0 0">Projets multi-artistes avec vue globale d'avancement et découpage collaboratif.</p>

        <span class="spacer"></span>
        <button class="btn btn-sm btn-primary" data-act="open-create-team-project" data-tid="${esc(t.id)}">${ic('plus')} Nouveau projet partagé</button>

      </div>
    </section>
  `;

  let contentBody = '';
  if (teamDetailTab === 'kanban') {
    contentBody = renderKanbanBoard(t.id, currentTeamTasks || [], t.members || [], t.projects || [], false);
  } else if (teamDetailTab === 'projects') {
    contentBody = membersSec + projectsSec;
  } else {
    // Vue overview globale
    const allTasks = currentTeamTasks || [];
    const doneCount = allTasks.filter(x => x.status === 'done').length;
    const progressPct = allTasks.length ? Math.round((doneCount / allTasks.length) * 100) : 0;
    const totalEst = allTasks.reduce((acc, x) => acc + (x.est || 0), 0);
    const totalSpent = allTasks.reduce((acc, x) => acc + (actualMin(x) || 0), 0);
    const ratio = (totalEst > 0 && totalSpent > 0) ? +(totalSpent / totalEst).toFixed(2) : null;

    contentBody = `
      <section class="team-overview-hero" style="margin-bottom:20px">
        <div class="hero-metric">
          <div class="hm-val">${progressPct} %</div>
          <div class="hm-lbl">Progression globale (${doneCount}/${allTasks.length} tâches)</div>
          <div class="proj-progress-bar"><div class="ppb-fill" style="width:${progressPct}%"></div></div>
        </div>
        <div class="hero-metric">
          <div class="hm-val">${fmtMin(totalEst)}</div>
          <div class="hm-lbl">Estimation totale d’équipe</div>
        </div>
        <div class="hero-metric">
          <div class="hm-val">${fmtMin(totalSpent)}</div>
          <div class="hm-lbl">Temps réel cumulé</div>
        </div>
        <div class="hero-metric">
          <div class="hm-val ${ratio && ratio > 1.15 ? 'text-miss' : ratio ? 'text-ok' : ''}">
            ${ratio ? '×' + ratio : '—'}
          </div>
          <div class="hm-lbl">${ratio ? (ratio > 1.15 ? 'Dépassement' : 'Dans les prévisions') : 'Non démarré'}</div>
        </div>
      </section>
      ${membersSec}
      ${projectsSec}
    `;
  }

  return head + tabsNav + contentBody;
}

function viewTeamProject(teamId, projectId) {
  const tp = currentTeamProject;
  if (!tp || tp.id !== projectId || tp.teamId !== teamId) {
    Promise.all([
      fetchTeam(teamId),
      fetchTeamProject(teamId, projectId),
      fetchTeamOverview(teamId, projectId)
    ]).then(() => renderSoon());
    return `<div class="card empty"><p class="muted">Chargement du projet collaboratif...</p></div>`;
  }

  const team = currentTeam || { id: teamId, name: 'Équipe', members: [] };
  const teamMembers = team.members || [];
  const tasks = Array.isArray(tp.tasks) ? tp.tasks : [];

  let totalEstMin = 0;
  let totalSpentMs = 0;
  let doneCount = 0;
  let wipCount = 0;
  let todoCount = 0;

  const memberWorkload = {};
  teamMembers.forEach(m => {
    memberWorkload[m.artistId] = {
      artistId: m.artistId,
      name: m.artistName,
      role: m.role,
      tasks: [],
      done: 0,
      wip: 0,
      todo: 0,
      estMin: 0,
      spentMs: 0
    };
  });
  const unassignedWorkload = {
    artistId: 'unassigned',
    name: 'Non assignée(s)',
    role: 'none',
    tasks: [],
    done: 0,
    wip: 0,
    todo: 0,
    estMin: 0,
    spentMs: 0
  };

  tasks.forEach(t => {
    const est = Number(t.est) || 0;
    const spent = spentMs(t);
    totalEstMin += est;
    totalSpentMs += spent;

    if (t.status === 'done') doneCount++;
    else if (t.status === 'wip') wipCount++;
    else todoCount++;

    const target = (t.assigneeId && memberWorkload[t.assigneeId])
      ? memberWorkload[t.assigneeId]
      : unassignedWorkload;

    target.tasks.push(t);
    target.estMin += est;
    target.spentMs += spent;
    if (t.status === 'done') target.done++;
    else if (t.status === 'wip') target.wip++;
    else target.todo++;
  });

  const totalSpentMin = Math.round(totalSpentMs / 60000);
  const progressPct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
  const ratio = (totalEstMin > 0 && totalSpentMin > 0)
    ? +(totalSpentMin / totalEstMin).toFixed(2)
    : null;

  // En-tête
  const head = `
    <div style="margin-bottom:14px">
      <a class="back no-print" href="#/equipe/${esc(teamId)}">${ic('left')} Équipe ${esc(team.name)}</a>
    </div>
    <div class="page-head" style="align-items:flex-start">
      <div>
        <div class="row" style="gap:8px">
          <h1><span class="mark">${esc(tp.name)}</span></h1>
          <span class="badge ${tp.status === 'done' ? 'badge-ok' : ''}" style="vertical-align:middle">
            ${tp.status === 'done' ? 'Terminé' : tp.status === 'wip' ? 'En production' : 'Planification'}
          </span>
        </div>
        <p class="muted" style="margin:6px 0 0">
          ${esc(tp.brief || 'Projet collaboratif de l’équipe.')}
        </p>
      </div>
      <div class="row">
        ${tp.status === 'plan' ? `
          <button class="btn btn-primary" data-act="start-team-prod" data-tid="${esc(teamId)}" data-pid="${esc(projectId)}">
            🚀 Lancer la production
          </button>
        ` : tp.status === 'wip' ? `
          <button class="btn btn-soft" data-act="finish-team-prod" data-tid="${esc(teamId)}" data-pid="${esc(projectId)}">
            🏁 Marquer comme Terminé
          </button>
        ` : `
          <button class="btn btn-ghost" data-act="reopen-team-prod" data-tid="${esc(teamId)}" data-pid="${esc(projectId)}">
            Rouvrir la production
          </button>
        `}
        <button class="btn btn-sm btn-ghost icon-btn" data-act="edit-team-project" data-tid="${esc(teamId)}" data-pid="${esc(projectId)}" title="Modifier le brief ou le nom">
          ${ic('pencil')}
        </button>
        <button class="btn btn-sm btn-ghost btn-danger icon-btn" data-act="del-team-project" data-tid="${esc(teamId)}" data-pid="${esc(projectId)}" data-pname="${esc(tp.name)}" title="Supprimer ce projet">
          ${ic('trash')}
        </button>
      </div>
    </div>
  `;

  // Baromètre Global
  let ratioComment = 'Non démarré';
  if (ratio) {
    if (ratio > 1.15) ratioComment = `Dépassement (+${Math.round((ratio - 1) * 100)} %)`;
    else if (ratio >= 0.9) ratioComment = 'Dans les prévisions';
    else ratioComment = `En avance (-${Math.round((1 - ratio) * 100)} %)`;
  }

  const heroBar = `
    <section class="team-overview-hero">
      <div class="hero-metric">
        <div class="hm-val">${progressPct} %</div>
        <div class="hm-lbl">Progression globale (${doneCount}/${tasks.length} tâches)</div>

      </div>
      <div class="hero-metric">
        <div class="hm-val">${fmtMin(totalEstMin)}</div>
        <div class="hm-lbl">Temps estimé total</div>
      </div>
      <div class="hero-metric">
        <div class="hm-val">${fmtMin(totalSpentMin)}</div>

      <div class="hero-metric">

          ${ratio ? '×' + ratio : '—'}
        </div>
        <div class="hm-lbl">${ratioComment}</div>
      </div>
    </section>

  // Workload Cards
  const allWorkloads = Object.values(memberWorkload);
  if (unassignedWorkload.tasks.length > 0) {
    allWorkloads.push(unassignedWorkload);
  }

  const workloadCards = allWorkloads.map(w => {
    const wSpentMin = Math.round(w.spentMs / 60000);
    const wPct = w.tasks.length ? Math.round((w.done / w.tasks.length) * 100) : 0;
    const wRatio = (w.estMin > 0 && wSpentMin > 0) ? +(wSpentMin / w.estMin).toFixed(2) : null;
    const isFiltered = teamFilterArtist === w.artistId;

    return `

  }).join('');

  const workloadSec = `
    <section class="card" style="margin-top:20px">

          <h2 style="margin:0">Répartition du travail par artiste</h2>
          <p class="small muted" style="margin:2px 0 0">Clique sur un artiste pour filtrer ses tâches ci-dessous.</p>

      </div>

  // Filtrage liste détaillée
  let filteredTasks = tasks;
  if (teamFilterArtist !== 'all') {

      filteredTasks = filteredTasks.filter(t => !t.assigneeId);
    } else {
      filteredTasks = filteredTasks.filter(t => t.assigneeId === teamFilterArtist);
    }

  if (teamFilterStatus !== 'all') {
    filteredTasks = filteredTasks.filter(t => t.status === teamFilterStatus);

  if (teamFilterCat !== 'all') {
    filteredTasks = filteredTasks.filter(t => t.cat === teamFilterCat);
  }

  const memberSelectOptions = teamMembers.map(m => `
    <option value="${esc(m.artistId)}">${esc(m.artistName)}</option>
  `).join('');

  const catSelectOptions = state.categories.map(c => `
    <option value="${esc(c.id)}">${esc(c.name)}</option>
  `).join('');

  const taskRows = filteredTasks.map(t => {
    const isDone = t.status === 'done';

    const spentM = actualMin(t);
    const est = t.est || 0;

    return `

        <div class="row" style="align-items:center;justify-content:space-between;gap:10px">
          <div class="row" style="gap:10px;flex:1;min-width:240px">
            <button class="btn btn-sm icon-btn ${isDone ? 'btn-primary' : 'btn-ghost'}" data-act="toggle-team-task-done" data-tid="${esc(t.id)}" title="${isDone ? 'Marquer comme à faire' : 'Marquer comme terminée'}">
              ${ic('check')}

            <div style="flex:1">
              <div style="font-weight:700;${isDone ? 'text-decoration:line-through;opacity:.7' : ''}">${esc(t.name)}</div>
              <div class="row" style="gap:6px;margin-top:2px">

  const filterBar = `

          <option value="${esc(m.artistId)}" ${teamFilterArtist === m.artistId ? 'selected' : ''}>${esc(m.artistName)}</option>

      <select class="input input-sm" data-act="filter-status-change" style="font-size:.82rem">
        <option value="all" ${teamFilterStatus === 'all' ? 'selected' : ''}>Tous les statuts</option>
        <option value="todo" ${teamFilterStatus === 'todo' ? 'selected' : ''}>À faire (${todoCount})</option>
        <option value="wip" ${teamFilterStatus === 'wip' ? 'selected' : ''}>En cours (${wipCount})</option>
        <option value="done" ${teamFilterStatus === 'done' ? 'selected' : ''}>Terminées (${doneCount})</option>
      </select>

      <select class="input input-sm" data-act="filter-cat-change" style="font-size:.82rem">

          <option value="${esc(c.id)}" ${teamFilterCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>

  const tasksSec = `
    <section class="card" style="margin-top:20px">
      <div class="row" style="justify-content:space-between">

          <p class="small muted" style="margin:2px 0 0">Chaque membre peut chronométrer son travail et cocher ses réalisations.</p>

  const tabsNav = `
    <div class="segmented-tabs" style="margin-top:16px;margin-bottom:20px">
      <button class="segmented-tab ${teamProjectTab === 'kanban' ? 'is-active' : ''}" data-act="set-team-proj-tab" data-tab="kanban">

      <button class="segmented-tab ${teamProjectTab === 'list' ? 'is-active' : ''}" data-act="set-team-proj-tab" data-tab="list">
        📝 Vue détaillée & Chronomètres

  `;

  if (teamProjectTab === 'kanban') {
    return head + heroBar + tabsNav + renderKanbanBoard(teamId, tp.tasks, teamMembers, [tp], true);
  }

  return head + heroBar + tabsNav + workloadSec + tasksSec;
}

/* ================== GRAPHIQUES SVG ================== */
function colPath(x, y0, y1, w, r) {
  const h = y0 - y1; if (h <= 0.5) return '';
  r = Math.min(r, h, w / 2);
  const l = x - w / 2, rr = x + w / 2;
  return `M${l},${y0}V${y1 + r}Q${l},${y1} ${l + r},${y1}H${rr - r}Q${rr},${y1} ${rr},${y1 + r}V${y0}Z`;
}

function drawCharts() {
  Object.entries(chartCfgs).forEach(([id, cfg]) => {
    const el = document.querySelector(`[data-chart="${id}"]`);
    if (el) drawXY(el, cfg);
  });
}

function drawXY(el, cfg) {
  const W = Math.max(260, Math.floor(el.clientWidth || 520));
  const H = cfg.height || 230;
  const m = { t: 20, r: cfg.type === 'line' ? 46 : 14, b: 30, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const pts = cfg.points, n = pts.length;
  const band = iw / n;
  const X = i => m.l + band * i + band / 2;
  const Y = v => m.t + ih - (clamp(v, cfg.yMin, cfg.yMax) - cfg.yMin) / (cfg.yMax - cfg.yMin) * ih;
  let g = '', refTxt = '';
  if (cfg.zone) {
    const y1 = Y(cfg.zone[1]), y0 = Y(cfg.zone[0]);
    g += `<rect x="${m.l}" y="${y1}" width="${iw}" height="${y0 - y1}" fill="var(--band)" opacity=".7" rx="4"/>`;
    g += `<text x="${m.l + iw - 6}" y="${y0 - 5}" text-anchor="end" font-size="11" fill="var(--ink-2)">${esc(cfg.zoneLabel || '')}</text>`;
  }
  cfg.ticks.forEach(v => {
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-hair)" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${esc(cfg.fmtTick(v))}</text>`;
  });
  g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--line-soft)" stroke-width="1"/>`;
  if (cfg.ref != null) {
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(cfg.ref)}" y2="${Y(cfg.ref)}" stroke="var(--ink-2)" stroke-width="1.5"/>`;
    refTxt = `<text x="${m.l + 6}" y="${Y(cfg.ref) - 6}" font-size="11" font-weight="600" fill="var(--ink-2)" stroke="var(--card)" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${esc(cfg.refLabel || '')}</text>`;
  }
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 62))));
  pts.forEach((p, i) => {
    if (i % every === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 9}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(p.label)}</text>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  if (cfg.type === 'line') {
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    g += `<path d="${d}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { g += `<circle class="mk" data-i="${i}" cx="${X(i)}" cy="${Y(p.y)}" r="5" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>`; });
    const L = pts[n - 1];
    g += `<text x="${X(n - 1) + 10}" y="${Y(L.y) + 4}" font-size="12.5" font-weight="700" fill="var(--ink)">${esc(cfg.fmtVal(L.y))}</text>`;
  } else {
    const w = Math.min(24, band * 0.6);
    pts.forEach((p, i) => { g += `<path class="mk" data-i="${i}" d="${colPath(X(i), m.t + ih, Y(p.y), w, 4)}" fill="var(--ok)"/>`; });
    const L = pts[n - 1];
    g += `<text x="${X(n - 1)}" y="${Y(L.y) - 7}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${esc(cfg.fmtVal(L.y))}</text>`;
  }
  g += refTxt;
  g += `<rect class="hit" x="${m.l}" y="${m.t - 8}" width="${iw}" height="${ih + 16}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;

  const svg = el.firstChild;
  const xh = svg.querySelector('.xh');
  const marks = $$('.mk', svg);
  let cur = -1;
  const setIdx = (i, cx, cy) => {
    cur = i;
    if (i < 0) { xh.setAttribute('opacity', 0); marks.forEach(mk => mk.removeAttribute('opacity')); hideTip(); return; }
    if (cfg.type === 'line') { xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('opacity', 1); }
    marks.forEach((mk, j) => cfg.type === 'line' ? mk.setAttribute('r', j === i ? 6.5 : 5) : mk.setAttribute('opacity', j === i ? 1 : 0.55));
    const p = pts[i];
    if (cx == null) { const r = svg.getBoundingClientRect(); cx = r.left + X(i); cy = r.top + Y(p.y); }
    showTip({ title: p.title, value: cfg.fmtVal(p.y), lines: p.lines }, cx, cy);
  };
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const i = clamp(Math.floor((e.clientX - r.left - m.l) / band), 0, n - 1);
    setIdx(i, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => setIdx(-1));
  el.onfocus = () => setIdx(n - 1);
  el.onblur = () => setIdx(-1);
  el.onkeydown = e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      setIdx(clamp((cur < 0 ? n - 1 : cur) + (e.key === 'ArrowRight' ? 1 : -1), 0, n - 1));
    } else if (e.key === 'Escape') setIdx(-1);
  };
}

function showTip(d, x, y) {
  const tip = $('#tip'); if (!tip) return;
  tip.textContent = '';
  const add = (cls, txt) => { if (!txt) return; const div = document.createElement('div'); div.className = cls; div.textContent = txt; tip.appendChild(div); };
  add('tv', d.value); add('tt', d.title);
  (d.lines || []).forEach(l => add('tl', l));
  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}
function hideTip() { const tip = $('#tip'); if (tip) tip.classList.remove('on'); }
function tipFrom(el) {

}

function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.dataset || !el.dataset.key) return null;
  let s = null, e = null;
  try { s = el.selectionStart; e = el.selectionEnd; } catch (_) { }
  return { key: el.dataset.key, s, e };
}
function restoreFocus(f) {

  if (!el) return;
  el.focus({ preventScroll: true });
  try {
    if (f.all) el.select();

  } catch (_) { }
}

/* ================== CHRONO ================== */
function stopTimer() {
  if (!state.timer) return;
  if (state.timer.teamId) {
    const tid = state.timer.tid;
    const pid = state.timer.pid;
    const teamId = state.timer.teamId;
    const elapsed = now() - state.timer.since;
    state.timer = null;
    if (currentTeamProject && currentTeamProject.id === pid) {
      const t = currentTeamProject.tasks.find(x => x.id === tid);
      if (t) {
        t.spent = (t.spent || 0) + elapsed;
        apiSaveTeamProject(teamId, currentTeamProject);
      }
    } else {
      fetchTeam(teamId).then(team => {
        if (!team) return;
        const p = (team.projects || []).find(x => x.id === pid);
        if (p) {
          const t = (p.tasks || []).find(x => x.id === tid);
          if (t) {
            t.spent = (t.spent || 0) + elapsed;
            apiSaveTeamProject(teamId, p);
          }
        }
      }).catch(() => {});
    }
    return;
  }
  const t = findTask(state, state.timer.pid, state.timer.tid);
  if (t) t.spent += now() - state.timer.since;
  state.timer = null;
}
function toggleTimer(p, t) {
  if (isRunning(t)) stopTimer();
  else { stopTimer(); state.timer = { pid: p.id, tid: t.id, since: now() }; }
  commit();
}
function toggleTeamTimer(tp, t) {
  if (isRunning(t)) {
    stopTimer();
  } else {
    stopTimer();
    state.timer = { pid: tp.id, tid: t.id, since: now(), teamId: tp.teamId, name: t.name, spent: t.spent || 0 };
  }
  render();
}
function updateTimerPill() {
  const pill = $('#timerPill');
  if (!state.timer) { pill.classList.remove('on'); return; }
  let t = null;
  let href = '#/projet/' + state.timer.pid;
  let taskName = '';
  let displaySpent = 0;

  if (state.timer.teamId) {
    if (currentTeamProject && currentTeamProject.id === state.timer.pid) {
      t = currentTeamProject.tasks.find(x => x.id === state.timer.tid);
    }
    taskName = t ? t.name : (state.timer.name || 'Tâche d’équipe');
    displaySpent = t ? spentMs(t) : ((state.timer.spent || 0) + (now() - state.timer.since));
    href = '#/equipe/' + state.timer.teamId + '/projet/' + state.timer.pid;
  } else {
    t = findTask(state, state.timer.pid, state.timer.tid);
    if (!t) { state.timer = null; pill.classList.remove('on'); return; }
    taskName = t.name;
    displaySpent = spentMs(t);
  }

  pill.classList.add('on');
  const a = $('#tpName'); a.textContent = taskName; a.href = href;
  $('#tpTime').textContent = fmtClock(displaySpent);
}
function tick() {
  if (!state.timer) return;
  let t = null;
  if (state.timer.teamId) {
    if (currentTeamProject && currentTeamProject.id === state.timer.pid) {
      t = currentTeamProject.tasks.find(x => x.id === state.timer.tid);
    }
    const runningSpent = t ? spentMs(t) : ((state.timer.spent || 0) + (now() - state.timer.since));
    const runningName = t ? t.name : (state.timer.name || 'Tâche');
    if (t) {
      $$(`[data-live-time="${t.id}"]`).forEach(el => el.textContent = fmtClock(runningSpent));
    }
    updateTimerPill();
    document.title = `${fmtClock(runningSpent)} · ${runningName} — Carnet de Prod`;
    return;
  }
  t = findTask(state, state.timer.pid, state.timer.tid);
  const p = getProject(state.timer.pid);
  if (!t || !p) return;
  $$(`[data-live-time="${t.id}"]`).forEach(el => el.textContent = fmtClock(spentMs(t)));
  $$(`[data-live-track="${t.id}"]`).forEach(el => el.innerHTML = taskTrackInner(t));
  const s = projectStats(p);
  $$(`[data-live-ptrack="${p.id}"]`).forEach(el => el.innerHTML = projTrackInner(p, s));
  $$('[data-live="p-actual"]').forEach(el => el.textContent = fmtMin(s.actualTotal));
  updateTimerPill();
  document.title = `${fmtClock(spentMs(t))} · ${t.name} — Carnet de Prod`;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const p = currentProject();
  const tid = el.dataset.tid;
  const t = p && tid ? p.tasks.find(x => x.id === tid) : null;

  switch (act) {
    case 'new-project': {
      const np = { id: uid(), name: 'Nouveau projet', brief: '', available: null, status: 'plan', createdAt: now(), startedAt: null, finishedAt: null, reflection: '', tasks: [] };
      state.projects.push(np); save();
      ui.focusKey = 'p-name'; ui.selectAll = true;
      location.hash = '#/projet/' + np.id;
      break;
    }
    case 'demo-load': closeModal(); loadDemo(); save(); location.hash = '#/projets'; render(); toast('Projets d’exemple chargés.'); break;
    case 'demo-remove': {
      if (state.timer && (getProject(state.timer.pid) || {}).demo) state.timer = null;
      state.projects = state.projects.filter(x => !x.demo);
      closeModal(); save(); if (!currentProject()) location.hash = '#/projets'; render(); toast('Exemples retirés.'); break;
    }
    case 'settings': openSettings(); break;
    case 'switch-artist': openArtistModal(false); break;
    case 'choose-artist': {

document.addEventListener('submit', async e => {

  const kind = form.dataset.form;

    const key = form.elements.key ? form.elements.key.value.trim() : '';
    if (!key) return;
    try {
      const res = await fetch('/api/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key })
      });
      if (!res.ok) throw new Error('Code ou mot de passe administrateur incorrect.');
      adminKey = key;
      sessionStorage.setItem('carnet:admin_key', key);
      closeModal();
      toast('Accès administrateur déverrouillé !');

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'kanban-search-input') {
    kanbanFilterSearch = el.value;
    renderSoon();
    return;
  }
  const f = el.dataset && el.dataset.field; if (!f) return;
  const p = currentProject();
  const t = p && el.dataset.tid ? p.tasks.find(x => x.id === el.dataset.tid) : null;
  switch (f) {
    case 'p.name': if (p) { el.value = el.value.replace(/\n/g, ' '); autoGrow(el); p.name = el.value; document.title = (p.name || 'Projet') + ' — Carnet de Prod'; save(); } break;
    case 'p.brief': if (p) { p.brief = el.value; save(); } break;
    case 'p.reflection': if (p) { p.reflection = el.value; save(); } break;
    case 'p.available': if (p) { p.available = parseDur(el.value); el.classList.toggle('bad', !!el.value.trim() && !p.available); save(); refreshPlanComputed(p); } break;
    case 't.name': if (t) { t.name = el.value; save(); refreshPlanComputed(p); } break;
    case 't.est': if (t) {
      const v = parseDur(el.value);
      t.est = v; el.classList.toggle('bad', !!el.value.trim() && !v);
      save(); refreshPlanComputed(p);
    } break;
    case 'd.name': {
      ui.draft.name = el.value;
      const g = guessCat(el.value);
      if (g && !ui.draft.catTouched) { ui.draft.cat = g; const sel = $('[data-key="d-cat"]'); if (sel) sel.value = g; }
      break;
    }
    case 'd.est': {
      ui.draft.est = el.value; const v = parseDur(el.value); el.classList.toggle('bad', !!el.value.trim() && !v);
      const r = $('[data-draft-range]'); if (r) r.textContent = v ? 'fourchette ' + fmtMin(v * CONF[ui.draft.conf].lo) + ' – ' + fmtMin(v * CONF[ui.draft.conf].hi) : '';
      break;
    }
    case 's.student': state.student = el.value; save(); break;
    case 's.cat': { const c = state.categories.find(x => x.id === el.dataset.cid); if (c) { c.name = el.value; save(); } break; }
  }
});
document.addEventListener('change', e => {

      }

      }
    });
    return;
  }

  const f = el.dataset && el.dataset.field;
  if (el.id === 'importFile' && el.files && el.files[0]) { importFile(el.files[0]); return; }
  if (!f) return;
  const p = currentProject();
  const t = p && el.dataset.tid ? p.tasks.find(x => x.id === el.dataset.tid) : null;
  if (f === 't.cat' && t) { t.cat = el.value; commit(); }
  else if (f === 'd.cat') { ui.draft.cat = el.value; ui.draft.catTouched = true; }
  else if (f === 't.est' || f === 'p.available') {
    if (el.value.trim() && !parseDur(el.value)) { toast('Durée non reconnue. Exemples : 45min, 1h30, 2h, 1,5 ou 1j.'); return; }
    renderSoon();
  } else if (f === 's.cat') { if (!$('#modalBg')) render(); }
});

document.addEventListener('dragstart', e => {
  const card = e.target.closest('.kanban-card');
  if (!card) return;
  draggedTaskId = card.dataset.tid;
  draggedProjectId = card.dataset.pid;
  draggedTeamId = card.dataset.teamid;
  card.classList.add('is-dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', card.dataset.tid);
});

document.addEventListener('dragend', e => {
  const card = e.target.closest('.kanban-card');
  if (card) card.classList.remove('is-dragging');
  document.querySelectorAll('.kanban-col.drag-over').forEach(el => el.classList.remove('drag-over'));
  draggedTaskId = null;
  draggedProjectId = null;
  draggedTeamId = null;
});

document.addEventListener('dragover', e => {
  const col = e.target.closest('.kanban-col');
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  col.classList.add('drag-over');
});

document.addEventListener('dragleave', e => {
  const col = e.target.closest('.kanban-col');
  if (!col) return;
  if (!col.contains(e.relatedTarget)) {
    col.classList.remove('drag-over');
  }
});

document.addEventListener('drop', async e => {
  const col = e.target.closest('.kanban-col');
  if (!col) return;
  e.preventDefault();
  col.classList.remove('drag-over');
  const newStatus = col.dataset.col;
  const tid = draggedTaskId || e.dataTransfer.getData('text/plain');
  const pid = draggedProjectId;
  const teamId = draggedTeamId || col.dataset.teamid;
  if (!tid || !newStatus || !pid || !teamId) return;
  await handleKanbanStatusChange(teamId, pid, tid, newStatus);
});

async function handleKanbanStatusChange(teamId, projectId, taskId, newStatus) {
  try {
    if (state.timer && state.timer.tid === taskId && newStatus !== 'wip') {
      stopTimer();
    }
    await apiUpdateTeamTaskDirect(teamId, projectId, taskId, { status: newStatus });
    render();
    toast(newStatus === 'done' ? 'Tâche marquée comme terminée !' : newStatus === 'wip' ? 'Tâche passée en cours !' : 'Tâche remise à faire.');
  } catch (err) {
    toast(err.message || 'Erreur lors du déplacement');
  }
}

/* ================== FICHE BILAN IMPRIMABLE (A4) ================== */
// Mise en page dédiée au papier / PDF : invisible à l'écran, seule visible à l'impression.
const PS_LINES = '<div class="ps-lines"><i></i><i></i><i></i><i></i></div>';
function printSheet(p) {
  const rep = buildReport(p);
  const s = rep.s;
  const R = s.ratio;
  const tasks = p.tasks.filter(t => t.status === 'done' && t.est > 0);
  const max = Math.max(1, ...tasks.map(t => Math.max(rangeOf(t)[1], actualMin(t)))) * 1.05;
  const same = p.startedAt && p.finishedAt && new Date(p.startedAt).toDateString() === new Date(p.finishedAt).toDateString();
  const period = !p.finishedAt ? '' : same || !p.startedAt ? `le ${fmtDate(p.finishedAt, true)}` : `du ${fmtDate(p.startedAt)} au ${fmtDate(p.finishedAt, true)}`;
  let verdict = 'Pas assez de tâches terminées pour conclure.';
  if (R != null) {
    if (R > 1.15) verdict = `Ton projet a pris <b>${Math.round((R - 1) * 100)} % de temps en plus</b> que ton découpage de départ.`;
    else if (R >= 0.85) verdict = `<b>Pile dans les temps</b> : à ${Math.round(Math.abs(R - 1) * 100)} % près de ton découpage de départ.`;
    else verdict = `Tu as fini <b>${Math.round((1 - R) * 100)} % plus vite</b> que ton découpage de départ.`;
  }
  const dots = n => `<span class="ps-dots" aria-label="confiance ${n} sur 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
  const res = t => {
    const c = classify(t); const d = actualMin(t) / t.est - 1;
    const pct = fmtPct(d);
    if (c === 'in') return `<span class="ps-res ok">✓ ${pct}</span>`;
    return `<span class="ps-res miss">${c === 'over' ? '▲' : '▼'} ${pct}</span>`;
  };
  const rows = tasks.map(t => `<tr>
      <td class="ps-name"><b>${esc(t.name)}</b><small>${esc(catName(t.cat))}${!t.planned ? ' · <em>oubliée au découpage</em>' : ''}</small></td>
      <td>${dots(t.conf)}</td>
      <td class="r">${fmtMin(t.est)}</td>
      <td class="r"><b>${fmtMin(actualMin(t))}</b></td>
      <td class="r">${res(t)}</td>
      <td class="ps-trk"><div class="ps-track">${taskTrackInner(t, max)}</div></td>
    </tr>`).join('');
  const toneCls = { bad: 'miss', warn: 'miss', good: 'ok', info: 'info' };
  const findings = rep.findings.map(f => `<li class="${toneCls[f.tone]}"><span class="ps-bullet"></span><div><span class="ps-tag">${esc(f.tag)}</span><b>${esc(f.title)}</b><p>${esc(f.text)}</p></div></li>`).join('');
  const actions = rep.actions.length
    ? `<ol>${rep.actions.map(a => `<li><span>${esc(a)}</span></li>`).join('')}</ol>`
    : '<p class="ps-muted">Rien de particulier : garde ta méthode !</p>';
  const cut = s.cut.length ? `<p class="ps-note">Coupées du scope : ${s.cut.map(t => esc(t.name)).join(', ')}.</p>` : '';
  const dateStr = new Date().toLocaleDateString('fr-FR');

  return `<div class="print-sheet" aria-hidden="true">
    <div class="ps-foot"><span>Carnet de Prod · Bilan « ${esc(p.name || 'Sans titre')} »</span><span>${state.student ? esc(state.student) + ' · ' : ''}imprimé le ${dateStr}</span></div>

    <header class="ps-head">
      <div class="ps-kicker">
        <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="#1d1a16" stroke-width="3" stroke-linecap="round"><path d="M16 5h8M20 5v4"/><circle cx="20" cy="23" r="13" fill="#ffd35c"/><path d="M20 23v-7.5M20 23l5.5 3"/></svg>
        Carnet de Prod — bilan de projet
      </div>
      <h1><span>${esc(p.name || 'Sans titre')}</span></h1>
      <div class="ps-meta">
        <span><b>Étudiant·e</b> ${state.student ? esc(state.student) : '<span class="ps-blank"></span>'}</span>
        ${period ? `<span><b>Production</b> ${period}</span>` : ''}
        ${p.available ? `<span><b>Temps disponible</b> ${fmtMin(p.available)}</span>` : ''}
      </div>
    </header>

    <section class="ps-kpis">
      <div class="ps-kpi"><div class="l">Prévu</div><div class="v">${fmtMin(s.plannedTotal)}</div><div class="s">au découpage</div></div>
      <div class="ps-kpi"><div class="l">Réel</div><div class="v">${fmtMin(s.actualTotal)}</div><div class="s">chronométré</div></div>
      <div class="ps-kpi hl"><div class="l">Réel ÷ prévu</div><div class="v">${fmtRatio(R)}</div><div class="s">${R != null ? fmtPct(R - 1) + ' de temps' : '—'}</div></div>
      <div class="ps-kpi"><div class="l">Justes</div><div class="v">${s.inRange}/${s.done.length}</div><div class="s">dans la fourchette</div></div>
      <div class="ps-kpi"><div class="l">Écart moyen</div><div class="v">${s.mape != null ? '±' + Math.round(s.mape * 100) + ' %' : '—'}</div><div class="s">par tâche</div></div>
      <div class="ps-kpi"><div class="l">Oubliées</div><div class="v">${s.unplanned.length}</div><div class="s">${s.cut.length ? plural(s.cut.length, 'coupée', 'coupées') + ' du scope' : 'rien de coupé'}</div></div>
    </section>
    <p class="ps-verdict">${verdict}</p>

    <section class="ps-sec">
      <div class="ps-sec-head">
        <h2>Prévu vs réel, tâche par tâche</h2>
        <div class="ps-legend"><span><i class="k-band"></i>ta fourchette</span><span><i class="k-tick"></i>ton estimation</span><span><i class="k-bar ok"></i>réel, dans la fourchette</span><span><i class="k-bar miss"></i>réel, hors fourchette</span></div>
      </div>
      ${tasks.length ? `<table class="ps-table">
        <thead><tr><th>Tâche</th><th>Confiance</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Écart</th><th class="ps-trk">La barre doit finir dans le surligné</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : '<p class="ps-muted">Aucune tâche terminée.</p>'}
      ${cut}
    </section>

    <div class="ps-cols">
      <section class="ps-sec ps-find">
        <h2>Ce que disent tes chiffres</h2>
        <ul>${findings}</ul>
      </section>
      <section class="ps-sec ps-next">
        <h2>Pour la prochaine fois</h2>
        ${actions}
      </section>
    </div>

    <div class="ps-cols ps-notes">
      <section class="ps-sec">
        <h2>Mon ressenti</h2>
        ${p.reflection && p.reflection.trim() ? `<div class="ps-text">${esc(p.reflection.trim())}</div>` : PS_LINES}
      </section>
      <section class="ps-sec">
        <h2>Retour de l’enseignant·e</h2>
        ${PS_LINES}
      </section>
    </div>

</div>`;
}

/* ================== DÉMARRAGE ================== */
window.addEventListener('hashchange', () => { ui.adding = false; ui.editTime = null; closeModal(); hideTip(); render(); if (!ui.focusKey) scrollTo(0, 0); });
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { drawCharts(); $$('.title-input').forEach(autoGrow); }, 150); });
window.addEventListener('beforeprint', () => {
  $$('.title-input').forEach(autoGrow);
  const p = currentProject();
  if (p && p.status === 'done') document.title = 'Bilan - ' + (p.name || 'projet') + (state.student ? ' - ' + state.student : '');
});
window.addEventListener('afterprint', () => { const p = currentProject(); document.title = (p ? (p.name || 'Projet') + ' — ' : '') + 'Carnet de Prod'; });
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { const s = load(); if (s) { state = s; render(); } } });
window.addEventListener('beforeunload', saveNow);
try { const th = localStorage.getItem(THEME_KEY); applyTheme(th || null); } catch (_) { applyTheme(null); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(document.documentElement.dataset.theme || null));
if (!storageOK) { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); storageOK = true; } catch (_) { storageOK = false; } }

// Démarrage : chargement du profil actif ou affichage du sélecteur
(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(ARTIST_KEY)); } catch (_) {}
  
  if (saved && saved.id) {
    currentArtist = saved;
    updateArtistBadge();
    const loaded = await loadArtistState(saved.id);
    state = loaded ? normalize(loaded) : freshState();
    if (!state.student) state.student = saved.name;
    await Promise.all([fetchTeams(true), fetchAllTasks(true)]).catch(() => {});
    render();
    saveNow();
  } else {
    render();
    updateArtistBadge();
    openArtistModal(true);
  }
})();

})();
